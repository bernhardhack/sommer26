<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sommer 26</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F2EE">
<meta name="description" content="Urlaubsplaner mit Wetter, freien Blöcken und Ideen.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sommer 26">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F2EE; --card:#FBFBF8; --ink:#2A2E6B;
  --rule:rgba(42,46,107,.16); --rule-strong:rgba(42,46,107,.34);
  --text:#191B2A; --muted:#6C7086; --marker:#9C2B2E; --petrol:#12707F;
  --amber:#E5A227;
  --display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top);padding-bottom:calc(56px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(to bottom,var(--rule) 1px,transparent 1px);background-size:100% 34px;opacity:.35}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

header{padding:22px 0 10px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--marker);font-weight:700;margin:0 0 6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,10vw,80px);line-height:.86;letter-spacing:-.03em;margin:0}
.sub{margin:10px 0 0;color:var(--muted);font-size:14px;max-width:58ch}
[contenteditable]{outline:none;border-radius:2px}
[contenteditable]:hover{box-shadow:0 1px 0 var(--rule-strong)}
[contenteditable]:focus{box-shadow:0 1px 0 var(--petrol);background:rgba(18,112,127,.05)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin:18px 0 12px;padding-top:14px;border-top:1.5px solid var(--rule-strong)}
.barL{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--rule-strong);border-radius:var(--r);overflow:hidden;background:var(--card)}
.seg button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;background:none;border:0;padding:8px 14px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--rule-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.mini{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--card);border:1.5px solid var(--rule-strong);border-radius:var(--r);padding:8px 12px;cursor:pointer;color:var(--text)}
.mini:hover{border-color:var(--ink)}
.wx-note{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}
.wx-note button{font:inherit;color:var(--petrol);background:none;border:0;border-bottom:1px solid currentColor;padding:0;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:0 0 auto}
.dot.live{background:#5B9B12}.dot.err{background:var(--marker)}

.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-left:2px}
.dow span:nth-child(n+6){color:var(--marker)}
.week{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}

.day{position:relative;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--r);padding:9px 9px 10px;min-height:152px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .14s ease,transform .14s ease;overflow:hidden}
.day:hover{border-color:var(--rule-strong)}
.day:focus-visible,.row:focus-visible{outline:2.5px solid var(--petrol);outline-offset:2px}
.day.past{opacity:.5}
.day.today{border-color:var(--marker);border-width:2px}
.day.tentative{border-style:dashed}

.hl{position:absolute;pointer-events:none;z-index:0;background:linear-gradient(180deg,rgba(200,237,60,0) 4%,rgba(200,237,60,.55) 6%,rgba(186,229,44,.82) 42%,rgba(200,237,60,.62) 88%,rgba(200,237,60,0) 93%);filter:url(#rough);mix-blend-mode:multiply}
.day .hl{left:-8px;right:-8px;top:20px;height:30px}
.day.hl-start .hl{left:5px}
.day.hl-end .hl{right:5px}

.d-top{display:flex;align-items:baseline;gap:6px;position:relative;z-index:1}
.d-num{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;letter-spacing:-.03em}
.d-dow{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.day.we .d-num{color:var(--marker)}
.d-today{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--marker);padding:2px 5px;border-radius:2px;margin-left:auto}

.wx{display:flex;align-items:center;gap:6px;position:relative;z-index:1;min-height:22px}
.wx svg{width:22px;height:22px;flex:0 0 auto}
.wx .t{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:-.02em}
.wx .tmin{font-family:var(--mono);font-size:11px;color:var(--muted)}
.wx .pp{font-family:var(--mono);font-size:10px;color:var(--petrol);font-weight:500}
.wx.empty .t{color:var(--muted);font-weight:400;font-size:12px}

.d-body{display:flex;flex-direction:column;gap:5px;position:relative;z-index:1;margin-top:auto}
.place{font-size:12.5px;font-weight:600;line-height:1.25;display:block}
.place.implied{color:var(--muted);font-weight:400}
.arrow{color:var(--petrol);font-family:var(--mono)}
.what{font-size:12px;color:var(--muted);line-height:1.3;display:block;border-left:2px solid rgba(18,112,127,.35);padding-left:5px;margin-left:-1px}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tag{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;padding:2px 5px;border-radius:2px;border:1px solid currentColor;line-height:1.35}
.tag.ta{color:var(--petrol)}.tag.za{color:#5B7A0B}.tag.buero{color:var(--ink)}
.tag.offen{color:var(--muted);border-style:dashed}
.who{display:flex;gap:3px;margin-left:auto}
.p{width:17px;height:17px;border-radius:50%;color:#fff;font-family:var(--mono);font-size:9px;font-weight:700;display:grid;place-items:center;line-height:1;flex:0 0 auto}

#list{position:relative}
.row{position:relative;display:grid;grid-template-columns:56px 96px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--r);padding:11px 12px;margin-bottom:5px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;overflow:visible}
.row.past{opacity:.5}
.row.today{border-color:var(--marker);border-width:2px}
.row.tentative{border-style:dashed}
.row .hl{left:5px;right:5px;top:-6px;bottom:-6px;height:auto;background:linear-gradient(90deg,rgba(200,237,60,0) 1%,rgba(200,237,60,.40) 3%,rgba(186,229,44,.62) 45%,rgba(200,237,60,.44) 95%,rgba(200,237,60,0) 99%)}
.row.hl-start .hl{top:4px}
.row.hl-end .hl{bottom:4px}
.rw-date{position:relative;z-index:1;display:flex;align-items:baseline;gap:5px}
.rw-main{position:relative;z-index:1;min-width:0}
.rw-main .place{font-size:13.5px}
.rw-tags{position:relative;z-index:1;display:flex;align-items:center;gap:6px}
.rw-wx{position:relative;z-index:1}

#cal{display:none}#list{display:none}
body.view-week #cal{display:block}
body.view-list #list{display:block}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:30px;border-top:1.5px solid var(--rule-strong);padding-top:16px}
h2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 12px}
.leg-grid{display:flex;flex-wrap:wrap;gap:6px 14px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:12.5px}
#ideasPanel{border:1.5px dashed transparent;border-radius:var(--r);padding:4px;margin:-4px}
.idea{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 2px;border-radius:2px}
.idea .grip{color:var(--muted);font-family:var(--mono);font-size:12px;line-height:1;cursor:grab;touch-action:none;padding:4px 3px;flex:0 0 auto;user-select:none}
.idea .grip:active{cursor:grabbing}
.idea .txt{flex:1;min-width:0}
.idea .del{background:none;border:0;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:12px;padding:2px 4px;opacity:.35}
.idea:hover .del,.idea .del:focus{opacity:1}
.addbtn{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;border-bottom:1px solid var(--rule-strong);color:var(--petrol);cursor:pointer;padding:3px 0;margin-top:8px}
.dragnote{font-size:11.5px;color:var(--muted);margin:0 0 10px;line-height:1.4}

/* drag */
.draggable{touch-action:none}
.ghost{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:#fff;font-family:var(--body);font-size:12px;font-weight:500;padding:6px 10px;border-radius:3px;box-shadow:0 10px 26px rgba(25,27,42,.32);max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translate(-50%,-165%)}
body.dragging{user-select:none;-webkit-user-select:none}
.drop-hot{outline:2.5px dashed var(--petrol)!important;outline-offset:2px;background:rgba(18,112,127,.07)}
#ideasPanel.drop-hot{border-color:var(--petrol)}

.scrim{position:fixed;inset:0;background:rgba(25,27,42,.42);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;background:var(--card);border:1.5px solid var(--rule-strong);left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);width:min(460px,calc(100vw - 32px));border-radius:var(--r);padding:22px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;max-height:86vh;overflow:auto;box-shadow:0 18px 50px rgba(25,27,42,.22);-webkit-overflow-scrolling:touch}
.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.sh-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
.sh-date{font-family:var(--display);font-weight:800;font-size:31px;line-height:1;letter-spacing:-.03em;margin:0;flex:1}
.nav{display:flex;gap:4px}
.nav button,.close{background:none;border:1.5px solid var(--rule);border-radius:2px;cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:13px;line-height:1;padding:6px 10px}
.nav button:hover,.close:hover{border-color:var(--ink);color:var(--text)}
.nav button[disabled]{opacity:.35;cursor:default}
.sh-sub{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.sh-wx{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.sh-wx svg{width:36px;height:36px;flex:0 0 auto}
.sh-wx .big{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.03em}
.sh-wx .meta{font-size:12px;color:var(--muted);line-height:1.4}

.f{margin-bottom:13px}
.f label,.fl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.f input[type=text],.f input[type=date]{width:100%;font-family:var(--body);font-size:16px;color:var(--text);background:transparent;border:0;border-bottom:1.5px solid var(--rule-strong);padding:5px 2px;border-radius:0}
.f input:focus{outline:none;border-bottom-color:var(--petrol);background:rgba(18,112,127,.04)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--card);border:1.5px solid var(--rule-strong);border-radius:2px;padding:6px 9px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.frei[aria-pressed="true"]{background:#8FBF14;border-color:#7CA80F;color:#1E2B02}
.chip.add{border-style:dashed;color:var(--petrol)}
.chip .p{width:14px;height:14px;font-size:8px}
.sh-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.linkbtn{background:none;border:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:4px 0;border-bottom:1px solid transparent}
.linkbtn:hover{color:var(--marker);border-bottom-color:currentColor}
.linkbtn.go{color:var(--petrol)}
.hint{font-size:11.5px;color:var(--muted);line-height:1.45}
.people-edit{display:flex;flex-direction:column;gap:6px}
.pe-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.pe-row input[type=color]{width:26px;height:26px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;-webkit-appearance:none;appearance:none}
.pe-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.pe-row input[type=color]::-webkit-color-swatch{border:1.5px solid var(--rule-strong);border-radius:50%}
.pe-row input[type=color]::-moz-color-swatch{border:1.5px solid var(--rule-strong);border-radius:50%}
.pe-row input[type=text]{border:0;border-bottom:1.5px solid var(--rule);font-size:16px;background:transparent;padding:3px 2px;width:100%;color:var(--text);font-family:var(--body)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:3px;opacity:0;transition:.2s ease;z-index:95;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

footer{margin-top:30px;padding-top:14px;border-top:1.5px solid var(--rule-strong);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:860px){.cols{grid-template-columns:1fr;gap:22px}}
@media (max-width:720px){
  header{padding:16px 0 8px}
  .week{gap:3px}
  .dow{gap:3px}
  .dow span{font-size:8px;letter-spacing:.06em;padding-left:1px}
  .day{min-height:104px;padding:5px 4px 6px;gap:3px;border-width:1px}
  .day.today{border-width:1.5px}
  .d-num{font-size:16px}
  .d-dow,.d-today{display:none}
  .day .hl{top:12px;height:19px;left:-5px;right:-5px}
  .day.hl-start .hl{left:3px}.day.hl-end .hl{right:3px}
  .wx{gap:2px;min-height:16px}
  .wx svg{width:15px;height:15px}
  .wx .t{font-size:10px}
  .wx .tmin,.wx .pp{display:none}
  .day .place{font-size:8.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day .what{display:none}
  .day .tag{font-size:7px;padding:1px 2px;letter-spacing:.02em}
  .day .tags{gap:2px}
  .day .who{gap:1px;margin-left:0;width:100%;flex-wrap:wrap}
  .day .p{width:11px;height:11px;font-size:6.5px}
  .row{grid-template-columns:52px 1fr;grid-template-areas:"date main" "wx tags";row-gap:8px}
  .rw-date{grid-area:date}.rw-main{grid-area:main}.rw-wx{grid-area:wx}
  .rw-tags{grid-area:tags;justify-content:flex-start;flex-wrap:wrap}
  .sheet{left:0;top:auto;bottom:0;transform:translateY(14px);width:100vw;max-height:92vh;border-radius:12px 12px 0 0;
    padding:20px max(20px,env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom))}
  .sheet.on{transform:translateY(0)}
  .idea .del{opacity:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="view-week">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough" x="-6%" y="-40%" width="112%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency="0.016 0.09" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="wrap">
  <header>
    <p class="eyebrow" id="range"></p>
    <h1 contenteditable="plaintext-only" id="title" spellcheck="false"></h1>
    <p class="sub" contenteditable="plaintext-only" id="subtitle"></p>
    <div class="bar">
      <div class="barL">
        <div class="seg" role="group" aria-label="Ansicht">
          <button id="btnWeek" aria-pressed="true">Wochen</button>
          <button id="btnList" aria-pressed="false">Liste</button>
        </div>
        <button class="mini" id="btnSettings">Einstellungen</button>
      </div>
      <div class="wx-note" id="wxNote"><span class="dot"></span> Wetter wird geladen…</div>
    </div>
  </header>

  <main>
    <section id="cal" aria-label="Kalender nach Wochen">
      <div class="dow"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div>
      <div id="weeks"></div>
    </section>
    <section id="list" aria-label="Tagesliste"></section>

    <div class="cols">
      <section>
        <h2>Ideen</h2>
        <p class="dragnote">Am Griff ziehen und auf einen Tag legen. Aus dem Tag heraus geht es genauso zurück.</p>
        <div id="ideasPanel"><div id="ideas"></div></div>
        <button class="addbtn" id="addIdea">+ Idee</button>
      </section>
      <section>
        <h2>Legende</h2>
        <div class="leg-grid" id="legWork"></div>
        <div class="leg-grid" id="legPeople" style="margin-top:14px"></div>
      </section>
    </div>
  </main>

  <footer>
    <span id="footL"></span>
    <span>Wetter: Open-Meteo</span>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">

<script>
"use strict";

/* ================= seed ================= */
function seed(){
  const D = {};
  const put = (d,o)=>{ D["2026-08-"+String(d).padStart(2,"0")] = o; };
  put(3,  {place:"Steyr", mode:"TA", what:"Spike Kit, baden", who:["J","E","P","B1","B2"]});
  put(4,  {place:"Steyr", to:"Brunnbach", mode:"Büro", what:"Wasserrad, baden", who:["J","E","P","O1","O2"]});
  put(5,  {place:"Brunnbach", to:"Steyr", mode:"Büro"});
  put(6,  {mode:"ZA", frei:true});
  put(7,  {mode:"ZA", frei:true});
  put(8,  {frei:true});
  put(9,  {frei:true});
  put(10, {mode:"TA"});
  put(11, {place:"Steyr", mode:"Büro", what:"Messer machen", who:["J"]});
  put(12, {mode:"Büro"});
  put(13, {place:"Linz", mode:"Büro", what:"Ars Electronica WS", who:["J","E"]});
  put(14, {place:"Wolfgangsee", mode:"ZA", frei:true});
  put(15, {place:"Wolfgangsee", frei:true});
  put(16, {place:"Wolfgangsee", frei:true});
  put(17, {place:"Wolfgangsee", mode:"ZA", frei:true});

/* ================= dates ================= */
const DOW = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MON = ["Jänner","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONS = ["Jän","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const parse = s => { const a = s.split("-").map(Number); return new Date(Date.UTC(a[0],a[1]-1,a[2])); };
const fmt = dt => dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0");
const addD = (s,n) => fmt(new Date(parse(s).getTime() + n*864e5));
const dowOf = s => parse(s).getUTCDay();
const dayNum = s => parse(s).getUTCDate();
const monOf = s => parse(s).getUTCMonth();
const diffD = (a,b) => Math.round((parse(b)-parse(a))/864e5);

function dateList(){
  if(parse(S.end) < parse(S.start)) return [S.start];
  const out = []; let d = S.start, g = 0;
  while(parse(d) <= parse(S.end) && g++ < 400){ out.push(d); d = addD(d,1); }
  return out;
}
const _n = new Date();
const TODAY = _n.getFullYear()+"-"+String(_n.getMonth()+1).padStart(2,"0")+"-"+String(_n.getDate()).padStart(2,"0");

function get(iso){ return S.days[iso] || {}; }
function set(iso, patch){
  const cur = Object.assign({}, S.days[iso] || {}, patch);
  Object.keys(cur).forEach(function(k){
    const v = cur[k];
    if(v === "" || v === false || v == null || (Array.isArray(v) && !v.length)) delete cur[k];
  });
  if(Object.keys(cur).length) S.days[iso] = cur; else delete S.days[iso];
}
function personById(id){ return S.people.filter(p=>p.id===id)[0]; }

function wxPrev(iso){
  const all = dateList(); let i = all.indexOf(iso) - 1;
  for(; i>=0; i--){ const x = get(all[i]); if(x.to) return x.to; if(x.place) return x.place; }
  return S.base;
}
function wxPlace(iso){
  const x = get(iso);
  if(x.to) return x.to;
  if(x.place) return x.place;
  return wxPrev(iso);
}
function blocks(){
  const out = []; let cur = null;
  dateList().forEach(function(iso){
    if(get(iso).frei){ if(!cur){ cur = {from:iso,to:iso}; out.push(cur); } else cur.to = iso; }
    else cur = null;
  });
  return out;
}
function blockOf(iso){ return blocks().filter(b=> iso>=b.from && iso<=b.to)[0]; }

/* ================= weather ================= */
const WXL = {clear:"Sonnig",mostly:"Meist sonnig",partly:"Teils bewölkt",cloud:"Bedeckt",fog:"Nebel",drizzle:"Nieselregen",rain:"Regen",snow:"Schnee",storm:"Gewitter"};
function wxKind(c){
  if(c===0) return "clear"; if(c===1) return "mostly"; if(c===2) return "partly"; if(c===3) return "cloud";
  if(c===45||c===48) return "fog"; if(c>=51&&c<=57) return "drizzle";
  if((c>=61&&c<=67)||(c>=80&&c<=82)) return "rain";
  if((c>=71&&c<=77)||c===85||c===86) return "snow";
  if(c>=95) return "storm"; return "cloud";
}
const CA="var(--amber)", CI="var(--ink)", CP="var(--petrol)";
function wxIcon(kind,size){
  const s = size||22;
  const o = 'width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  const sun = '<circle cx="12" cy="12" r="4.2" stroke="'+CA+'" fill="rgba(229,162,39,.18)"/><g stroke="'+CA+'"><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></g>';
  const cl = c => '<path d="M7.2 18h9.4a3.6 3.6 0 0 0 .3-7.2 5.1 5.1 0 0 0-9.8-.7A3.9 3.9 0 0 0 7.2 18Z" stroke="'+(c||CI)+'" fill="rgba(42,46,107,.06)"/>';
  switch(kind){
    case "clear":  return '<svg '+o+'>'+sun+'</svg>';
    case "mostly": return '<svg '+o+'><g transform="translate(1.5,-2) scale(.8)">'+sun+'</g>'+cl()+'</svg>';
    case "partly": return '<svg '+o+'><g transform="translate(4,-1.5) scale(.68)">'+sun+'</g>'+cl()+'</svg>';
    case "cloud":  return '<svg '+o+'>'+cl()+'</svg>';
    case "fog":    return '<svg '+o+'>'+cl()+'<g stroke="'+CI+'" opacity=".6"><path d="M5 20.6h6M13.4 20.6h5.6"/></g></svg>';
    case "drizzle":return '<svg '+o+'><g transform="translate(0,-1.6)">'+cl()+'</g><g stroke="'+CP+'"><path d="M9 18.4l-.8 2.4M13 18.4l-.8 2.4"/></g></svg>';
    case "rain":   return '<svg '+o+'><g transform="translate(0,-1.8)">'+cl(CP)+'</g><g stroke="'+CP+'"><path d="M8.4 18.2l-1.1 3M12 18.2l-1.1 3M15.6 18.2l-1.1 3"/></g></svg>';
    case "snow":   return '<svg '+o+'><g transform="translate(0,-1.8)">'+cl()+'</g><g stroke="'+CP+'"><path d="M8.6 19.4v2.4M7.5 20h2.2M14.2 19.4v2.4M13.1 20h2.2"/></g></svg>';
    case "storm":  return '<svg '+o+'><g transform="translate(0,-1.8)">'+cl()+'</g><path d="M12.6 17.6l-3 3.6h2.4l-.9 2.6 3.1-3.8h-2.3z" stroke="'+CA+'" fill="'+CA+'" fill-opacity=".35"/></svg>';
    default:       return '<svg '+o+'>'+cl()+'</svg>';
  }
}

const weather = {};
let wxErr = "";

function usedPlaces(){
  const s = {};
  dateList().forEach(function(iso){ const n = wxPlace(iso); if(n && S.places[n]) s[n] = 1; });
  return Object.keys(s);
}
function missingPlaces(){
  const s = {};
  dateList().forEach(function(iso){ const n = wxPlace(iso); if(n && !S.places[n]) s[n] = 1; });
  return Object.keys(s);
}
async function geocode(name){
  const u = "https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(name)+"&count=1&language=de&format=json";
  const r = await fetch(u);
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j = await r.json();
  if(!j.results || !j.results.length) throw new Error("nicht gefunden");
  return {lat:j.results[0].latitude, lon:j.results[0].longitude};
}
async function ensurePlaces(){
  const miss = missingPlaces();
  for(let i=0;i<miss.length;i++){
    const n = miss[i];
    try{ S.places[n] = await geocode(n); save(); toast(n+" gefunden"); }
    catch(e){ /* leave without coordinates */ }
  }
}
function wxWindow(){
  const t = new Date();
  const base = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
  const maxEnd = fmt(new Date(base + 15*864e5));
  const minStart = fmt(new Date(base - 60*864e5));
  const start = S.start < minStart ? minStart : S.start;
  const end   = S.end   > maxEnd   ? maxEnd   : S.end;
  return start > end ? null : {start:start, end:end};
}
async function loadWeather(){
  setNote("loading");
  wxErr = "";
  try{ await ensurePlaces(); }catch(e){}
  const win = wxWindow();
  const names = usedPlaces();
  if(!win){ setNote("window"); render(); return; }
  if(!names.length){ setNote("none"); render(); return; }

  const results = await Promise.all(names.map(function(n){
    const p = S.places[n];
    const u = "https://api.open-meteo.com/v1/forecast?latitude="+p.lat+"&longitude="+p.lon
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
      + "&timezone=Europe%2FVienna&start_date="+win.start+"&end_date="+win.end;
    return fetch(u)
      .then(function(r){ return r.json().then(function(j){
          if(!r.ok) throw new Error(j && j.reason ? j.reason : "HTTP "+r.status);
          return j; }); })
      .then(function(j){ return {n:n, j:j}; })
      .catch(function(e){ return {n:n, err:(e && e.message) || "Netzwerkfehler"}; });
  }));

  let ok = 0;
  results.forEach(function(res){
    if(res.err){ wxErr = wxErr || res.err; return; }
    const dd = res.j && res.j.daily; if(!dd) return;
    const b = weather[res.n] = {};
    dd.time.forEach(function(t,k){
      if(dd.temperature_2m_max[k]==null) return;
      b[t] = {c:dd.weather_code[k], max:Math.round(dd.temperature_2m_max[k]),
              min:Math.round(dd.temperature_2m_min[k]),
              pp:dd.precipitation_probability_max ? dd.precipitation_probability_max[k] : null};
    });
    ok++;
  });
  setNote(ok ? (ok===names.length ? "live" : "partial") : "error");
  render();
}
function setNote(st){
  const el = document.getElementById("wxNote");
  const n = usedPlaces().length;
  if(st==="loading"){ el.innerHTML = '<span class="dot"></span> Wetter wird geladen…'; return; }
  if(st==="live")        el.innerHTML = '<span class="dot live"></span> Wetter live · '+n+' Orte <button type="button" id="reload">neu laden</button>';
  else if(st==="partial")el.innerHTML = '<span class="dot err"></span> Wetter teilweise geladen <button type="button" id="reload">nochmal</button>';
  else if(st==="none")   el.innerHTML = '<span class="dot"></span> Kein Ort mit Koordinaten <button type="button" id="reload">nochmal</button>';
  else if(st==="window") el.innerHTML = '<span class="dot"></span> Zeitraum außerhalb der Vorhersage';
  else                   el.innerHTML = '<span class="dot err"></span> Wetter offline'+(wxErr?" ("+esc(wxErr)+")":"")+' <button type="button" id="reload">nochmal</button>';
  const b = document.getElementById("reload");
  if(b) b.addEventListener("click", loadWeather);
}
function wxFor(iso){ const b = weather[wxPlace(iso)]; return b ? b[iso] : null; }

function hlCls(iso, weekAware){
  const b = blockOf(iso); if(!b) return "";
  let c = " frei"; const dw = dowOf(iso);
  if(iso===b.from || (weekAware && dw===1)) c += " hl-start";
  if(iso===b.to   || (weekAware && dw===0)) c += " hl-end";
  return c;
}
const isPast = iso => iso < TODAY;

function render(){

function renderWeeks(){

/* ================= drag & drop ================= */
let dragging = null, ghost = null, hot = null, blockClick = false;

document.addEventListener("pointerdown", function(e){
  const h = e.target.closest("[data-drag]");
  if(!h) return;
  if(e.button && e.button !== 0) return;
  const startX = e.clientX, startY = e.clientY;
  let live = false;

  function move(ev){
    if(!live){
      if(Math.abs(ev.clientX-startX) + Math.abs(ev.clientY-startY) < 7) return;
      live = true;
      beginDrag(h);
    }
    ev.preventDefault();
    moveDrag(ev.clientX, ev.clientY);
  }
  function up(ev){
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
    if(live){ blockClick = true; endDrag(ev.clientX, ev.clientY); }
  }
  window.addEventListener("pointermove", move, {passive:false});
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
}, true);

function beginDrag(h){
  const type = h.dataset.drag;
  const text = type==="idea" ? S.ideas[+h.dataset.i] : get(h.dataset.iso).what;
  dragging = {type:type, text:text, i:h.dataset.i, iso:h.dataset.iso};
  ghost = document.createElement("div");
  ghost.className = "ghost";
  ghost.textContent = text || "";
  document.body.appendChild(ghost);
  document.body.classList.add("dragging");
}
function moveDrag(x,y){
  if(ghost){ ghost.style.left = x+"px"; ghost.style.top = y+"px"; }
  const el = document.elementFromPoint(x,y);
  const t = el && el.closest('[data-drop="day"], #ideasPanel');
  if(t !== hot){
    if(hot) hot.classList.remove("drop-hot");
    hot = t;
    if(hot) hot.classList.add("drop-hot");
  }
}
function endDrag(x,y){
  const el = document.elementFromPoint(x,y);
  const target = el && el.closest('[data-drop="day"], #ideasPanel');
  if(hot) hot.classList.remove("drop-hot");
  if(ghost) ghost.remove();
  ghost = null; hot = null;
  document.body.classList.remove("dragging");
  const d = dragging; dragging = null;
  if(!d || !target) return;

  if(target.id === "ideasPanel"){
    if(d.type === "what"){
      S.ideas.push(d.text);
      set(d.iso, {what:""});
      saved("zurück in die Ideen");
      render(); 
    }
    return;
  }
  const iso = target.dataset.iso;
  if(!iso) return;

  if(d.type === "idea"){
    const cur = get(iso).what;
    set(iso, {what: cur ? cur+" · "+d.text : d.text});
    S.ideas.splice(+d.i, 1);
    saved(dayNum(iso)+"."+(monOf(iso)+1)+". · "+d.text);
    render();
  } else if(d.type === "what" && iso !== d.iso){
    const cur = get(iso).what;
    set(iso, {what: cur ? cur+" · "+d.text : d.text});
    set(d.iso, {what:""});
    saved("verschoben auf "+dayNum(iso)+".");
    render();
  }
}

function openDay(iso){
  const all = dateList();
  if(all.indexOf(iso) < 0) return;
  if(!openIso) lastFocus = document.activeElement;
  openIso = iso;
  const x = get(iso), w = wxFor(iso), b = blockOf(iso), i = all.indexOf(iso);
  const blockLen = b ? diffD(b.from,b.to)+1 : 0;
  const known = Object.keys(S.places).map(function(n){ return '<option value="'+esc(n)+'">'; }).join("");
  const wxBox = w
    ? '<div class="sh-wx">'+wxIcon(wxKind(w.c),36)+'<div><div class="big">'+w.max+'° <span style="font-size:14px;color:var(--muted)">/ '+w.min+'°</span></div>'
      + '<div class="meta">'+WXL[wxKind(w.c)]+' in '+esc(wxPlace(iso))+(w.pp!=null?' · '+w.pp+'% Niederschlag':'')+'</div></div></div>'
    : '<div class="sh-wx"><div class="meta">Keine Vorhersage für '+esc(wxPlace(iso))+' — außerhalb des 16-Tage-Fensters oder Ort ohne Koordinaten.</div></div>';

  sheet.innerHTML =
    '<div class="sh-head">'
    + '<h3 class="sh-date">'+DOW[dowOf(iso)]+' '+dayNum(iso)+'. '+MON[monOf(iso)]+'</h3>'
    + '<div class="nav">'
    + '<button type="button" id="prevD"'+(i===0?" disabled":"")+' title="Vorheriger Tag">‹</button>'
    + '<button type="button" id="nextD"'+(i===all.length-1?" disabled":"")+' title="Nächster Tag">›</button>'
    + '<button type="button" class="close" id="closeD" aria-label="Schließen">✕</button></div></div>'
    + '<p class="sh-sub">'+(x.frei?"Frei":(x.mode||"—"))+(blockLen>1?' · Tag '+(diffD(b.from,iso)+1)+' von '+blockLen:'')+'</p>'
    + wxBox
    + '<div class="f"><span class="fl">Status</span><div class="chips">'
      + '<button class="chip frei" type="button" data-t="frei" aria-pressed="'+(!!x.frei)+'">Frei</button>'
      + '<button class="chip" type="button" data-m="TA" aria-pressed="'+(x.mode==="TA")+'">TA</button>'
      + '<button class="chip" type="button" data-m="ZA" aria-pressed="'+(x.mode==="ZA")+'">ZA</button>'
      + '<button class="chip" type="button" data-m="Büro" aria-pressed="'+(x.mode==="Büro")+'">Büro</button>'
      + '<button class="chip" type="button" data-t="offen" aria-pressed="'+(!!x.offen)+'">Offen</button></div></div>'
    + '<div class="f2">'
      + '<div class="f"><label for="fPlace">Wo</label><input type="text" id="fPlace" list="placeList" value="'+esc(x.place||"")+'" placeholder="'+esc(wxPlace(iso))+'"></div>'
      + '<div class="f"><label for="fTo">Weiter nach</label><input type="text" id="fTo" list="placeList" value="'+esc(x.to||"")+'" placeholder="—"></div></div>'
    + '<datalist id="placeList">'+known+'</datalist>'
    + '<div class="f"><label for="fWhat">Was</label><input type="text" id="fWhat" value="'+esc(x.what||"")+'" placeholder="Plan, Termin, Notiz"></div>'
    + '<div class="f"><span class="fl">Wer</span><div class="chips">'
      + S.people.map(function(p){
          return '<button class="chip" type="button" data-who="'+esc(p.id)+'" aria-pressed="'+((x.who||[]).indexOf(p.id)>=0)+'">'
            + '<span class="p" style="background:'+esc(p.c)+'">'+esc(p.id[0])+'</span>'+esc(p.name)+'</button>';
        }).join("")
      + '<button class="chip add" type="button" id="addWho">+ Person</button>'
      + '</div></div>'
    + '<p class="hint">Das Wetter folgt dem Ort des Tages — ohne Eintrag gilt der letzte bekannte Ort. Neue Orte werden automatisch geokodiert.</p>'
    + '<div class="sh-foot"><button class="linkbtn" type="button" id="clearD">Tag leeren</button>'
    + '<button class="linkbtn go" type="button" id="doneD">Fertig</button></div>';

  openSheet();
  const refresh = function(reweather){ saved(); render(); if(reweather) loadWeather(); openDay(openIso); };

  sheet.querySelector("#closeD").onclick = closeSheet;
  sheet.querySelector("#doneD").onclick = closeSheet;
  sheet.querySelector("#prevD").onclick = function(){ if(i>0) openDay(all[i-1]); };
  sheet.querySelector("#nextD").onclick = function(){ if(i<all.length-1) openDay(all[i+1]); };
  sheet.querySelector("#clearD").onclick = function(){ delete S.days[iso]; refresh(true); };

  sheet.querySelectorAll("[data-m]").forEach(function(btn){
    btn.onclick = function(){ const m = btn.dataset.m; set(iso,{mode: get(iso).mode===m ? "" : m}); refresh(false); };
  });
  sheet.querySelectorAll("[data-t]").forEach(function(btn){
    btn.onclick = function(){ const t = btn.dataset.t, p = {}; p[t] = !get(iso)[t]; set(iso,p); refresh(false); };
  });
  sheet.querySelectorAll("[data-who]").forEach(function(btn){
    btn.onclick = function(){ toggleWho(iso, btn.dataset.who); refresh(false); };
  });
  sheet.querySelector("#addWho").onclick = function(){
    const id = addPerson();
    if(id){ toggleWho(iso, id); refresh(false); }
  };
  const bindText = function(sel, field, reweather){
    const el = sheet.querySelector(sel);
    el.onchange = function(){ const p = {}; p[field] = el.value.trim(); set(iso,p); saved(); render(); if(reweather) loadWeather(); };
    el.onkeydown = function(e){ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } };
  };
  bindText("#fPlace","place",true);
  bindText("#fTo","to",true);
  bindText("#fWhat","what",false);
}

function toggleWho(iso, id){
  const cur = (get(iso).who||[]).slice();
  const k = cur.indexOf(id);
  if(k>=0) cur.splice(k,1); else cur.push(id);
  cur.sort(function(p,q){
    return S.people.findIndex(function(z){return z.id===p;}) - S.people.findIndex(function(z){return z.id===q;});
  });
  set(iso,{who:cur});
}
function addPerson(){
  const name = prompt("Name?");
  if(!name || !name.trim()) return null;
  const first = name.trim()[0].toUpperCase();
  let id = first, n = 1;
  while(S.people.some(function(p){ return p.id===id; })){ n++; id = first + n; }
  const pal = ["#2A2E6B","#9C2B2E","#12707F","#6B4E9C","#1F6B3A","#B4761A","#8A5A8E","#C24E1B","#4A6FA5","#7A6B2F"];
  S.people.push({id:id, name:name.trim(), c:pal[S.people.length % pal.length]});
  save();
  return id;
}

function openSettings(){
  if(!openIso) lastFocus = document.activeElement;
  sheet.innerHTML =
    '<div class="sh-head"><h3 class="sh-date">Einstellungen</h3>'
    + '<div class="nav"><button type="button" class="close" id="closeS" aria-label="Schließen">✕</button></div></div>'
    + '<p class="sh-sub">Zeitraum · Personen · Daten</p>'
    + '<div class="f2"><div class="f"><label for="sStart">Von</label><input type="date" id="sStart" value="'+S.start+'"></div>'
    + '<div class="f"><label for="sEnd">Bis</label><input type="date" id="sEnd" value="'+S.end+'"></div></div>'
    + '<div class="f"><label for="sBase">Standard-Ort</label><input type="text" id="sBase" value="'+esc(S.base)+'"></div>'
    + '<div class="f"><span class="fl">Personen</span><div class="people-edit">'
    + S.people.map(function(p,i){
        return '<div class="pe-row"><input type="color" value="'+esc(p.c)+'" data-pc="'+i+'" aria-label="Farbe">'
          + '<input type="text" value="'+esc(p.name)+'" data-pn="'+i+'" aria-label="Name">'
          + '<button class="linkbtn" type="button" data-pd="'+i+'">Entf.</button></div>';
      }).join("")
    + '</div><button class="addbtn" type="button" id="addPerson">+ Person</button></div>'
    + '<div class="f"><span class="fl">Daten</span><div class="chips">'
    + '<button class="chip" type="button" id="expJ">Export</button>'
    + '<button class="chip" type="button" id="impJ">Import</button>'
    + '<button class="chip" type="button" id="resetJ">Zurücksetzen</button></div>'
    + '<p class="hint" style="margin-top:8px">'
    + (canPersist
        ? "Alles bleibt auf diesem Gerät gespeichert. Export sichert eine JSON-Datei, die sich woanders importieren lässt."
        : "Speichern im Browser ist hier blockiert — Änderungen gelten nur für diese Sitzung. Nimm Export, um sie zu sichern.")
    + '</p></div>'
    + '<div class="sh-foot"><span class="hint">'+dateList().length+' Tage</span>'
    + '<button class="linkbtn go" type="button" id="doneS">Fertig</button></div>';
  openSheet();

  sheet.querySelector("#closeS").onclick = closeSheet;
  sheet.querySelector("#doneS").onclick = closeSheet;

  const st = sheet.querySelector("#sStart"), en = sheet.querySelector("#sEnd");
  st.onchange = function(){ if(st.value){ S.start = st.value; if(S.end < S.start) S.end = S.start; } saved(); render(); loadWeather(); openSettings(); };
  en.onchange = function(){ if(en.value){ S.end = en.value; if(S.end < S.start) S.start = S.end; } saved(); render(); loadWeather(); openSettings(); };
  sheet.querySelector("#sBase").onchange = function(e){ S.base = e.target.value.trim() || "Steyr"; saved(); render(); loadWeather(); };

  sheet.querySelectorAll("[data-pc]").forEach(function(el){ el.onchange = function(){ S.people[+el.dataset.pc].c = el.value; saved(); render(); }; });
  sheet.querySelectorAll("[data-pn]").forEach(function(el){ el.onchange = function(){ S.people[+el.dataset.pn].name = el.value.trim()||"?"; saved(); render(); }; });
  sheet.querySelectorAll("[data-pd]").forEach(function(el){
    el.onclick = function(){
      const i = +el.dataset.pd, id = S.people[i].id;
      S.people.splice(i,1);
      Object.keys(S.days).forEach(function(k){
        const w = S.days[k].who;
        if(w){ S.days[k].who = w.filter(function(z){ return z!==id; }); if(!S.days[k].who.length) delete S.days[k].who; }
      });
      saved(); render(); openSettings();
    };
  });
  sheet.querySelector("#addPerson").onclick = function(){ if(addPerson()){ saved(); render(); openSettings(); } };

  sheet.querySelector("#expJ").onclick = function(){
    const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (S.title||"plan").toLowerCase().replace(/[^a-z0-9]+/g,"-")+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast("exportiert");
  };
  sheet.querySelector("#impJ").onclick = function(){ document.getElementById("fileIn").click(); };
  sheet.querySelector("#resetJ").onclick = function(){
    if(!confirm("Alles auf den ursprünglichen Plan zurücksetzen?")) return;
    S = seed(); saved("zurückgesetzt"); applyView(); render(); loadWeather(); closeSheet();
  };
}

document.getElementById("fileIn").onchange = function(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(){
    try{
      const j = JSON.parse(r.result);
      if(!j || !j.days || !j.start) throw new Error("shape");
      S = j;
      if(!S.places) S.places = {};
      if(!S.people) S.people = [];
      if(!S.ideas)  S.ideas  = [];
      saved("importiert"); applyView(); render(); loadWeather(); closeSheet();
    }catch(err){ toast("Datei nicht lesbar"); }
  };
  r.readAsText(f); e.target.value = "";
};

/* ================= view ================= */
function applyView(){
  const v = S.view || (window.innerWidth <= 720 ? "list" : "week");
  document.body.classList.toggle("view-week", v==="week");
  document.body.classList.toggle("view-list", v==="list");
  document.getElementById("btnWeek").setAttribute("aria-pressed", v==="week");
  document.getElementById("btnList").setAttribute("aria-pressed", v==="list");
}
document.getElementById("btnWeek").onclick = function(){ S.view = "week"; save(); applyView(); };
document.getElementById("btnList").onclick = function(){ S.view = "list"; save(); applyView(); };
document.getElementById("btnSettings").onclick = openSettings;
scrim.onclick = closeSheet;

document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ closeSheet(); return; }
  if(openIso && e.target.tagName!=="INPUT" && !e.target.isContentEditable){
    const all = dateList(), i = all.indexOf(openIso);
    if(e.key==="ArrowLeft" && i>0){ e.preventDefault(); openDay(all[i-1]); }
    if(e.key==="ArrowRight" && i<all.length-1){ e.preventDefault(); openDay(all[i+1]); }
  }
});

document.addEventListener("click", function(e){
  if(blockClick){ blockClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const d = e.target.closest("[data-delidea]");
  if(d){ S.ideas.splice(+d.dataset.delidea,1); saved(); renderIdeas(); return; }
  if(e.target.closest("[data-idea]")) return;
  const b = e.target.closest("[data-iso]");
  if(b) openDay(b.dataset.iso);
}, true);

document.getElementById("addIdea").onclick = function(){
  S.ideas.push("Neue Idee"); saved(); renderIdeas();
  const els = document.querySelectorAll("[data-idea]");
  const last = els[els.length-1];
  if(last){ last.focus(); const sel = window.getSelection(); if(sel && sel.selectAllChildren) sel.selectAllChildren(last); }
};
document.getElementById("ideas").addEventListener("blur", function(e){
  const el = e.target.closest("[data-idea]"); if(!el) return;
  const t = el.textContent.trim(), i = +el.dataset.idea;
  if(t) S.ideas[i] = t; else S.ideas.splice(i,1);
  saved(); renderIdeas();
}, true);

["title","subtitle"].forEach(function(id){
  const el = document.getElementById(id);
  el.addEventListener("blur", function(){ S[id] = el.textContent.trim(); saved(); render(); });
  el.addEventListener("keydown", function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); el.blur(); } });
});

applyView();
render();
loadWeather();

if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
