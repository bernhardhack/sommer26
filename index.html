<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sommer 26</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Urlaubsplaner mit Wetter, freien Blöcken und Ideen.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sommer 26">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF8;
  --card:#FFFFFF;
  --line:#EBEBE7;
  --line-2:#DDDDD8;
  --text:#222222;
  --text-2:#717171;
  --text-3:#9A9A95;
  --coral:#E8595E;
  --teal:#0E7C74;
  --sage:#5B8C6E;
  --free:#E4EFE7;
  --free-2:#D3E6D9;
  --free-ink:#2E6B4F;
  --sand:#F3EFE7;
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --r:14px;
  --r-sm:10px;
  --sh:0 1px 2px rgba(0,0,0,.04);
  --sh-2:0 6px 20px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;overflow-x:clip}
body{touch-action:pan-y pinch-zoom}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:15px;line-height:1.5;letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top);padding-bottom:calc(56px + env(safe-area-inset-bottom));
}
.wrap{max-width:1140px;margin:0 auto;
  padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2)}

/* ---------- update banner ---------- */
.banner{display:none;align-items:center;gap:14px;flex-wrap:wrap;background:var(--sand);
  border-radius:var(--r);padding:14px 18px;margin:16px 0 0;font-size:14px;color:var(--text)}
.banner.on{display:flex}
.banner .b-txt{flex:1;min-width:220px}
.banner button{font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:8px 16px;cursor:pointer;border:1px solid var(--line-2);background:#fff;color:var(--text)}
.banner button.primary{background:var(--text);color:#fff;border-color:var(--text)}

/* ---------- header ---------- */
header{padding:40px 0 6px}
.eyebrow{margin:0 0 10px}
h1{font-weight:800;font-size:clamp(34px,6.2vw,54px);line-height:1.05;letter-spacing:-.032em;margin:0}
.sub{margin:12px 0 0;color:var(--text-2);font-size:16px;line-height:1.55;max-width:62ch}
[contenteditable]{outline:none;border-radius:6px}
[contenteditable]:hover{background:rgba(0,0,0,.03)}
[contenteditable]:focus{background:rgba(14,124,116,.07);box-shadow:0 0 0 2px rgba(14,124,116,.25)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:28px 0 18px}
.barL{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:#F0F0EC;border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:600;background:none;border:0;padding:8px 18px;cursor:pointer;color:var(--text-2);border-radius:999px;transition:background .15s ease,color .15s ease}
.seg button[aria-pressed="true"]{background:#fff;color:var(--text);box-shadow:var(--sh)}
.pill{font:inherit;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--text)}
.pill:hover{border-color:var(--text-3)}
.wx-note{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.wx-note button{font:inherit;font-size:13px;font-weight:600;color:var(--teal);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);display:inline-block;flex:0 0 auto}
.dot.live{background:var(--sage)}.dot.err{background:var(--coral)}
.dot.sync{background:var(--teal)}
.sync-note{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.f input[type=password]{width:100%;font-family:var(--font);font-size:15px;color:var(--text);background:#fff;
  border:1px solid var(--line-2);border-radius:var(--r-sm);padding:11px 13px}
.f input[type=password]:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 3px rgba(0,0,0,.06)}

/* ---------- calendar ---------- */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:10px}
.dow span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2);padding-left:4px}
.week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:8px}

.day{min-width:0;position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 13px;min-height:158px;display:flex;flex-direction:column;gap:9px;cursor:pointer;
  text-align:left;font:inherit;color:inherit;box-shadow:var(--sh);
  transition:box-shadow .18s ease,border-color .18s ease}
.day:hover{box-shadow:var(--sh-2);border-color:var(--line-2)}
.day:focus-visible,.row:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.day.past{opacity:.45}
.day.tentative{border-style:dashed;border-color:var(--line-2);box-shadow:none;background:transparent}
.day.today{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral)}

/* free block: continuous soft band, Airbnb date-range style */
.hl{position:absolute;pointer-events:none;z-index:0;background:var(--free);
  left:-9px;right:-9px;top:-1px;bottom:-1px;border-radius:0}
.day.hl-start .hl{left:-1px;border-top-left-radius:var(--r);border-bottom-left-radius:var(--r)}
.day.hl-end .hl{right:-1px;border-top-right-radius:var(--r);border-bottom-right-radius:var(--r)}
.day.frei{border-color:transparent;box-shadow:none;background:transparent}
.day.frei:hover{box-shadow:none}
.day.frei:hover .hl{background:var(--free-2)}
.day.frei.today{box-shadow:0 0 0 1px var(--coral);border-color:var(--coral)}

.d-top{display:flex;align-items:center;gap:7px;position:relative;z-index:1;min-width:0}
.d-num{font-weight:800;font-size:19px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.d-dow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.day.we .d-dow{color:var(--coral)}
.day.frei .d-num{color:var(--free-ink)}
.d-today{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--coral);padding:3px 7px;border-radius:999px;margin-left:auto}

.wx{display:flex;align-items:center;gap:6px;position:relative;z-index:1;min-height:24px;min-width:0}
.wx svg{width:24px;height:24px;flex:0 0 auto}
.wx .t{font-size:15px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wx .tmin{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.rain{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;line-height:1.45;white-space:nowrap}
.rain.lo{background:#F0F0EC;color:var(--text-2)}
.rain.mid{background:#DFEDEB;color:var(--teal)}
.rain.hi{background:var(--teal);color:#fff}
.mtr{display:inline-flex;align-items:flex-end;gap:1.5px;margin-left:5px;vertical-align:-1px}
.mtr i{width:3px;height:8px;border-radius:1px;background:currentColor;opacity:.26}
.mtr i.on{opacity:1}
.wx.empty{opacity:.4}
.wx.empty .t{color:var(--text-3);font-weight:500;font-size:13px}

.d-body{display:flex;flex-direction:column;gap:7px;position:relative;z-index:1;margin-top:auto;min-width:0}
.d-body .place{order:9;margin-top:1px}
.place{font-size:14px;font-weight:600;line-height:1.3;display:block;letter-spacing:-.01em}
.place.implied{color:var(--text-2);font-weight:500}
.arrow{color:var(--text-3);font-weight:500}
.what{font-size:13px;color:var(--text-2);line-height:1.35;display:block;
  background:rgba(0,0,0,.035);border-radius:8px;padding:5px 8px;cursor:grab}
.day.frei .what{background:rgba(255,255,255,.65)}
.what:active{cursor:grabbing}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;line-height:1.4;background:#F0F0EC;color:var(--text-2)}
.tag.ta{background:#E3EFEE;color:var(--teal)}
.tag.za{background:#E4EFE7;color:var(--free-ink)}
.tag.buero{background:#F0F0EC;color:var(--text-2)}
.tag.offen{background:transparent;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.who{display:flex;gap:-4px;margin-left:auto}
.p{width:22px;height:22px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;
  display:grid;place-items:center;line-height:1;flex:0 0 auto;box-shadow:0 0 0 2px #fff;margin-left:-5px}
.day.frei .p{box-shadow:0 0 0 2px var(--free)}
.who .p:first-child{margin-left:0}

/* ---------- list ---------- */
.row{position:relative;display:grid;grid-template-columns:64px 184px minmax(0,1fr) auto;gap:16px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:8px;
  width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;box-shadow:var(--sh);
  transition:box-shadow .18s ease}
.row:hover{box-shadow:var(--sh-2)}
.row.past{opacity:.45}
.row.today{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral)}
.row.tentative{border-style:dashed;box-shadow:none;background:transparent}
.row.frei{border-color:transparent;box-shadow:none;background:transparent}
.row .hl{left:-1px;right:-1px;top:-5px;bottom:-5px;border-radius:0}
.row.hl-start .hl{top:-1px;border-top-left-radius:var(--r);border-top-right-radius:var(--r)}
.row.hl-end .hl{bottom:-1px;border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r)}
.rw-date{position:relative;z-index:1;display:flex;align-items:baseline;gap:7px}
.rw-date .d-num{font-size:24px}
.rw-main{position:relative;z-index:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rw-tags{position:relative;z-index:1;display:flex;align-items:center;gap:8px}
.rw-wx{position:relative;z-index:1;min-width:0}
.rw-wx .wx{flex-wrap:nowrap;white-space:nowrap}

#cal{display:none}#list{display:none}#places{display:none}
body.view-week #cal{display:block}
body.view-list #list{display:block}
body.view-places #places{display:block}

/* ---------- ideas / legend ---------- */
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;margin-top:52px;border-top:1px solid var(--line);padding-top:32px}
h2{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2);margin:0 0 6px}
.dragnote{font-size:13.5px;color:var(--text-2);margin:0 0 14px;line-height:1.5}
#ideasPanel{border:1.5px dashed transparent;border-radius:var(--r);padding:6px;margin:-6px;transition:border-color .15s ease,background .15s ease}
.idea{display:flex;align-items:center;gap:4px;font-size:14.5px;padding:9px 6px 9px 2px;border-radius:var(--r-sm);
  transition:background .15s ease}
.idea:hover{background:rgba(0,0,0,.03)}
.idea .grip{color:var(--text-3);font-size:15px;line-height:1;cursor:grab;touch-action:none;padding:6px 8px;flex:0 0 auto;user-select:none;border-radius:6px}
.idea .grip:hover{background:rgba(0,0,0,.05);color:var(--text-2)}
.idea .grip:active{cursor:grabbing}
.idea .txt{flex:1;min-width:0;padding:2px 4px}
.idea .kind{background:none;border:1px solid var(--line-2);color:var(--text-2);cursor:pointer;font-size:12px;
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;line-height:1;font-family:var(--font)}
.idea .kind:hover{border-color:var(--text)}
.idea .kind[data-k="out"]{background:#FBF2E4;border-color:#EBDCC2;color:#9A6B2F}
.idea .kind[data-k="in"]{background:#E3EFEE;border-color:#CBE2E0;color:var(--teal)}
.rec{display:inline-flex;align-items:center;gap:7px;font-family:var(--font);font-size:13px;font-weight:600;
  background:#fff;border:1px dashed var(--line-2);border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--text)}
.rec:hover{border-style:solid;border-color:var(--text)}
.rec .k{display:inline-flex;opacity:.75}
.rec.plain{border-style:solid;border-color:var(--line);color:var(--text-2)}
.ptr{position:fixed;top:0;left:50%;z-index:70;transform:translate(-50%,-46px);opacity:0;
  background:var(--text);color:#fff;font-size:12px;font-weight:600;padding:8px 16px;
  border-radius:999px;pointer-events:none;transition:opacity .15s ease;white-space:nowrap;
  margin-top:calc(8px + env(safe-area-inset-top))}
.ptr.ready{background:var(--teal)}
.what .sp{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;opacity:.7}
.what.cont{opacity:.62}
.pick{position:relative;display:flex;align-items:stretch;gap:0}
.pick input[type=text]{border-top-right-radius:0;border-bottom-right-radius:0;border-right:0}
.pick-btn{flex:0 0 auto;width:42px;background:#fff;border:1px solid var(--line-2);
  border-top-right-radius:var(--r-sm);border-bottom-right-radius:var(--r-sm);
  cursor:pointer;color:var(--text-2);font-size:12px;font-family:var(--font)}
.pick-btn:hover{color:var(--text);border-color:var(--text-3)}
.pick-list{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:12;background:#fff;
  border:1px solid var(--line-2);border-radius:var(--r-sm);box-shadow:0 12px 30px rgba(0,0,0,.16);
  max-height:210px;overflow:auto;padding:5px}
.pick-opt{display:block;width:100%;text-align:left;font-family:var(--font);font-size:15px;font-weight:500;
  background:none;border:0;padding:9px 11px;border-radius:8px;cursor:pointer;color:var(--text)}
.pick-opt:hover{background:#F2F2EE}
.pick-opt.clear{color:var(--text-2);font-weight:400}
.items{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.item-row{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:var(--r-sm);padding:9px 10px 9px 13px}
.item-t{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.3}
.item-t small{display:block;font-size:11.5px;font-weight:500;color:var(--text-2);margin-top:2px}
.span-ctl{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.span-ctl button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);background:#fff;
  cursor:pointer;color:var(--text-2);font-family:var(--font);font-size:14px;line-height:1;display:grid;place-items:center}
.span-ctl button:hover{border-color:var(--text);color:var(--text)}
.span-ctl button[disabled]{opacity:.3;cursor:default}
.span-ctl .n{font-size:12px;font-weight:700;min-width:46px;text-align:center;color:var(--text-2)}
.item-del{width:26px;height:26px;border-radius:50%;border:0;background:none;cursor:pointer;
  color:var(--text-3);font-size:13px;flex:0 0 auto;font-family:var(--font)}
.item-del:hover{background:rgba(0,0,0,.06);color:var(--coral)}
.pl-row{display:flex;align-items:center;gap:10px;font-size:14px;padding:5px 0}
.pinbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);background:#fff;cursor:pointer;
  color:var(--text-3);display:grid;place-items:center;flex:0 0 auto;padding:0}
.pinbtn:hover{border-color:var(--text-3);color:var(--text-2)}
.pinbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.wxgrid{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;
  overscroll-behavior-x:contain;touch-action:pan-x pan-y pinch-zoom}
table.wxt{border-collapse:separate;border-spacing:4px;font-family:var(--font)}
.wxt th{font-weight:600;padding:0}
.wxt th.dh{min-width:60px;text-align:center;padding:2px 0 8px}
.wxt th.dh .dw{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.wxt th.dh .dn{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
.wxt th.dh.today .dn{color:var(--coral)}
.wxt th.ph{position:sticky;left:0;z-index:2;background:var(--bg);text-align:left;
  padding-right:14px;white-space:nowrap;vertical-align:middle}
.wxt th.ph .phi{display:flex;align-items:center;gap:9px}
.wxt th.ph .pn{font-size:14px;font-weight:600}
.wxt thead th.ph{min-width:150px}
.wxt td.wc{min-width:60px;text-align:center;background:#fff;border:1px solid var(--line);
  border-radius:var(--r-sm);padding:8px 4px 7px;vertical-align:middle}
.wxt td.wc svg{display:block;margin:0 auto 2px}
.wxt td.wc .ct{display:block;font-size:14px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wxt td.wc .cr{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px}
.wxt td.wc .cr.lo{background:#F0F0EC;color:var(--text-2)}
.wxt td.wc .cr.mid{background:#DFEDEB;color:var(--teal)}
.wxt td.wc .cr.hi{background:var(--teal);color:#fff}
.wxt td.wc.here{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.wxt td.wc.dim{opacity:.34}
.wxt td.wc.today{background:#FFF7F7}
.wxt td.wc.empty{color:var(--text-3);background:transparent;border-style:dashed}
@media (max-width:720px){
  /* stack the pin above the name so the sticky column stops eating a
     whole card's worth of width */
  .wxt th.ph{min-width:0;padding-right:7px}
  .wxt thead th.ph{min-width:68px}
  .wxt th.ph .phi{flex-direction:column;align-items:flex-start;gap:3px}
  .wxt th.ph .pn{font-size:11.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:66px}
  .pinbtn{width:22px;height:22px}
  .wxt th.dh{min-width:48px}
  .wxt td.wc{min-width:48px;padding:6px 2px}
  .wxt td.wc svg{width:17px;height:17px}
  .wxt td.wc .ct{font-size:13px}
  .wxt td.wc .cr{font-size:9.5px;padding:1px 4px}
  .mtr{margin-left:3px;gap:1px}
  .mtr i{width:2.5px;height:6px}
  .pinbtn{width:24px;height:24px}
}
.pl-row .nm{flex:1;min-width:0;font-weight:500}
.pl-row .co{font-size:11.5px;color:var(--text-3)}
.rec.plain:hover{border-color:var(--text);color:var(--text)}
.disclose{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-size:13px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--text-2);background:none;border:0;padding:4px 0;cursor:pointer}
.disclose:hover{color:var(--text)}
.disclose .chev{transition:transform .18s ease;font-size:11px;display:inline-block}
.disclose[aria-expanded="true"] .chev{transform:rotate(180deg)}
.disclose .cnt{font-size:11px;font-weight:700;letter-spacing:0;background:#F0F0EC;color:var(--text-2);
  border-radius:999px;padding:2px 8px}
.idea .kind svg{display:block}
.idea .del{background:none;border:0;color:var(--text-3);cursor:pointer;font-size:14px;padding:4px 8px;opacity:0;border-radius:6px;line-height:1}
.idea:hover .del,.idea .del:focus{opacity:1}
.idea .del:hover{background:rgba(0,0,0,.05);color:var(--coral)}
.addbtn{font:inherit;font-size:13px;font-weight:600;background:none;border:0;color:var(--teal);cursor:pointer;padding:8px 4px;margin-top:6px;text-decoration:underline;text-underline-offset:3px}
.leg-grid{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.leg-item{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-2)}
.leg-item .p{margin-left:0;box-shadow:none}

/* ---------- drag ---------- */
.draggable{touch-action:none}
.ghost{position:fixed;z-index:90;pointer-events:none;background:var(--text);color:#fff;font-family:var(--font);

/* ---------- sheet ---------- */

.sh-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}

  background:var(--text);color:#fff;font-family:var(--font);font-size:13px;font-weight:600;

footer{margin-top:52px;padding-top:24px;border-top:1px solid var(--line);font-size:13px;color:var(--text-3);

<body class="view-week">

<div class="wrap">
  <div class="banner" id="banner">
    <span class="b-txt" id="bannerTxt"></span>
    <button type="button" class="primary" id="bLoad">Neuen Plan laden</button>
    <button type="button" id="bKeep">Meinen behalten</button>
  </div>

  <header>
    <p class="eyebrow lbl" id="range"></p>
    <h1 contenteditable="plaintext-only" id="title" spellcheck="false"></h1>
    <p class="sub" contenteditable="plaintext-only" id="subtitle"></p>
    <div class="bar">
      <div class="barL">
        <div class="seg" role="group" aria-label="Ansicht">
          <button id="btnWeek" aria-pressed="true">Wochen</button>
          <button id="btnList" aria-pressed="false">Liste</button>
          <button id="btnPlaces" aria-pressed="false">Orte</button>
        </div>
        <button class="pill" id="btnSettings">Einstellungen</button>
      </div>
      <div class="wx-note" id="wxNote"><span class="dot"></span> Wetter wird geladen…</div>
      <div class="sync-note" id="syncNote"></div>

  <main>

      <div id="weeks"></div>

    <div class="cols">

        <div id="ideasPanel"><div id="ideas"></div></div>

  <footer>

</div>

<div class="scrim" id="scrim"></div>

<input type="file" id="fileIn" accept="application/json" style="display:none">

<script>
"use strict";

/* Bump SEED_VERSION whenever the published plan below changes.
   Visitors who already edited locally get asked whether to take the new one. */
const SEED_VERSION = 4;

function seed(){
  const D = {};
  const put = (d,o)=>{ D["2026-08-"+String(d).padStart(2,"0")] = o; };
  put(3,  {place:"Steyr", mode:"TA", what:"Spike Kit, baden", who:["J","E","P","B1","B2"]});
  put(4,  {place:"Steyr", to:"Brunnbach", mode:"Büro", what:"Wasserrad, baden", who:["J","E","P","O1","O2"]});
  put(5,  {place:"Brunnbach", to:"Steyr", mode:"Büro"});
  put(6,  {mode:"ZA", frei:true});
  put(7,  {mode:"ZA", frei:true});
  put(8,  {frei:true});
  put(9,  {frei:true});
  put(10, {mode:"TA"});
  put(11, {place:"Steyr", mode:"Büro", what:"Messer machen", who:["J"]});
  put(12, {mode:"Büro"});
  put(13, {place:"Linz", mode:"Büro", what:"Ars Electronica WS", who:["J","E"]});
  put(14, {place:"Wolfgangsee", mode:"ZA", frei:true});
  put(15, {place:"Wolfgangsee", frei:true});
  put(16, {place:"Wolfgangsee", frei:true});
  put(17, {place:"Wolfgangsee", mode:"ZA", frei:true});
  put(18, {place:"Wolfgangsee", mode:"ZA", frei:true});
  put(19, {place:"Steyr", mode:"ZA", what:"Ale arrives Linz 5:58", frei:true});
  put(20, {place:"Steyr", mode:"ZA", what:"Last Day, depart Slzbg 22:02", who:["J","E","A"], frei:true});
  put(21, {place:"Steyr", mode:"TA", offen:true});
  put(22, {frei:true});
  put(23, {place:"Steyr", to:"Wien", frei:true, offen:true});
  return {
    seedVersion: SEED_VERSION,
    title:"Sommer 26",
    subtitle:"Nach dem Attersee (26.7.–1.8.): drei Wochen zwischen Steyr, Brunnbach, Linz und dem Wolfgangsee. Das Wetter kommt jeweils vom Ort des Tages.",
    start:"2026-08-03",
    end:"2026-08-23",
    base:"Steyr",
    view:"",
    days:D,
    people:[
      {id:"J",  name:"Jacob", c:"#3D5A80"},
      {id:"E",  name:"Emma",  c:"#C1666B"},
      {id:"P",  name:"Pippa", c:"#0E7C74"},
      {id:"B1", name:"Bert",  c:"#7D6B9E"},
      {id:"B2", name:"Ben",   c:"#5B8C6E"},
      {id:"O1", name:"Opa",   c:"#C08552"},
      {id:"O2", name:"Oma",   c:"#A6799B"},
      {id:"A",  name:"Ale",   c:"#D08C60"}
    ],
    places:{
      "Steyr":{lat:48.0387,lon:14.4211},
      "Brunnbach":{lat:47.7700,lon:14.5300},
      "Linz":{lat:48.3069,lon:14.2858},
      "Wolfgangsee":{lat:47.7386,lon:13.4472},
      "Wien":{lat:48.2082,lon:16.3738},
      "Taiskirchen":{lat:48.2569,lon:13.5453},
      "Graz":{lat:47.0707,lon:15.4395}
    },
    ideas:[
      {t:"Emma Party", k:"any"},
      {t:"Free Tree Open Air, Taiskirchen — 7.–9.8.", k:"out"},
      {t:"La Strada, Graz — bis 8.8.", k:"out"},
      {t:"Wien — Haus des Meeres", k:"in"},
      {t:"Brunnbach — Wasserrad, baden", k:"out"}
    ]
  };
}

/* ================= state ================= */
const KEY = "sommer26.v3";
let S = null, canPersist = true;

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }
  catch(e){ canPersist = false; }
  return null;
}
function save(){
  const sg = sigOf(S);
  const changed = (lastSig !== null && sg !== lastSig);
  if(changed) S.updatedAt = Date.now();
  lastSig = sg;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ canPersist = false; }
  if(changed) schedulePush();
}
function writeLocal(){
  lastSig = sigOf(S);
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ canPersist = false; }
}
function saved(msg){ save(); toast(msg || (canPersist ? "Gespeichert" : "Nur in dieser Sitzung")); }

/* A signature of the plan's actual content. Device-local things — the
   view toggle, timestamps, the sync baseline — are deliberately out, so
   opening a day or switching views is not mistaken for an edit. */
const SIG_KEYS = ["title","subtitle","start","end","base","days","people","places","ideas","pins"];
function stable(v){
  if(Array.isArray(v)) return "["+v.map(stable).join(",")+"]";
  if(v && typeof v === "object"){
    return "{"+Object.keys(v).sort().map(function(k){ return JSON.stringify(k)+":"+stable(v[k]); }).join(",")+"}";
  }
  return JSON.stringify(v === undefined ? null : v);
}
function sigOf(o){
  const t = {};
  SIG_KEYS.forEach(function(k){ t[k] = o[k]; });
  return stable(t);
}
let lastSig = null;

function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(function(b){ bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64dec(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  const bin = atob(s);
  const bytes = Uint8Array.from(bin, function(c){ return c.charCodeAt(0); });
  return new TextDecoder().decode(bytes);
}
function b64std(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(function(b){ bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64stdDec(s){
  const bin = atob(String(s).replace(/\s+/g,""));
  const bytes = Uint8Array.from(bin, function(c){ return c.charCodeAt(0); });
  return new TextDecoder().decode(bytes);
}
function uid(){ return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function normalise(o){
  if(!o.places) o.places = {};
  if(!o.people) o.people = [];
  if(!o.ideas)  o.ideas  = [];
  o.ideas = o.ideas.map(function(x){
    return (typeof x === "string") ? {t:x, k:"any"} : {t:(x && x.t) || "", k:(x && x.k) || "any"};
  }).filter(function(x){ return x.t; });
  if(!Array.isArray(o.pins)){
    o.pins = ["Steyr","Brunnbach","Wien","Graz"].filter(function(n){ return o.places[n]; });
  }
  o.pins = o.pins.filter(function(n){ return o.places[n]; });
  if(!o.days) o.days = {};
  Object.keys(o.days).forEach(function(k){
    const d = o.days[k];
    if(!d.items && d.what){
      d.items = String(d.what).split(" · ").map(function(t){
        return {id:uid(), t:t.trim(), k:"any"};
      }).filter(function(z){ return z.t; });
    }
    delete d.what;
    if(d.items && !d.items.length) delete d.items;
  });
  return o;
}

/* shared link takes priority, then local copy, then the published plan */
let fromLink = null;
if(location.hash.indexOf("#plan=") === 0){
  try{ fromLink = normalise(JSON.parse(b64dec(location.hash.slice(6)))); }catch(e){ fromLink = null; }
  history.replaceState(null,"",location.pathname + location.search);
}
const stored = load();
if(fromLink && (!stored || confirm("Geteilten Plan aus dem Link laden? Deine lokale Version wird ersetzt."))){
  S = fromLink;
}else{
  S = stored || seed();
}
normalise(S);

let tt;
function toast(m){
  const el = document.getElementById("toast");
  el.textContent = m; el.classList.add("on");
  clearTimeout(tt); tt = setTimeout(function(){ el.classList.remove("on"); }, 1800);
}

/* published-plan update notice */
function checkSeedVersion(){
  if(!stored || fromLink) return;
  if(stored.seedVersion === SEED_VERSION) return;
  const b = document.getElementById("banner");
  document.getElementById("bannerTxt").textContent =
    "Der veröffentlichte Plan wurde aktualisiert. Du siehst gerade deine eigene Version.";
  b.classList.add("on");
  document.getElementById("bLoad").onclick = function(){
    S = seed(); saved("Neuer Plan geladen"); b.classList.remove("on");
    applyView(); render(); loadWeather();
  };
  document.getElementById("bKeep").onclick = function(){
    S.seedVersion = SEED_VERSION; save(); b.classList.remove("on");
  };
}

/* ================= sync (one editor, many readers) =================
   Editor devices hold a fine-grained PAT in localStorage and write
   plan.json back to the repo. Everyone else just reads plan.json off
   GitHub Pages — no token, always the published state. */
const SYNC_KEY = "sommer26.sync";
let sync = {token:"", repo:"bernhardhack/sommer26", path:"plan.json", branch:"main"};
try{
  const raw = localStorage.getItem(SYNC_KEY);
  if(raw) sync = Object.assign(sync, JSON.parse(raw));
}catch(e){}
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); }catch(e){} }
let remoteSha = null, syncState = sync.token ? "idle" : "reader", pushT = null;

function ghHeaders(){
  return {Authorization:"Bearer "+sync.token, Accept:"application/vnd.github+json",
          "X-GitHub-Api-Version":"2022-11-28"};
}
function ghUrl(){
  return "https://api.github.com/repos/"+sync.repo+"/contents/"+sync.path;
}
async function pullRemote(){
  if(sync.token){
    const r = await fetch(ghUrl()+"?ref="+encodeURIComponent(sync.branch)+"&t="+Date.now(), {headers:ghHeaders()});
    if(r.status === 404){ remoteSha = null; return null; }
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    remoteSha = j.sha;
    return normalise(JSON.parse(b64stdDec(j.content)));
  }
  const r = await fetch("plan.json?t="+Date.now(), {cache:"no-store"});
  if(!r.ok) return null;
  return normalise(await r.json());
}
async function pushRemote(){
  if(!sync.token) return;
  setSync("saving");
  try{
    /* Re-read immediately before writing. A cached sha goes stale the
       moment the other device pushes, and GitHub then rejects the write —
       which used to fail silently and strand the change on this device. */
    let remote = null;
    try{ remote = await pullRemote(); }catch(e){ remoteSha = null; }

    if(remote){
      const rs = sigOf(remote), ls = sigOf(S), bs = S.baseSig;
      if(rs === ls){ S.baseSig = rs; writeLocal(); setSync("ok"); return; }
      if(bs && rs !== bs){        // the other device moved too
        setSync("ok"); offerRemote(remote); return;
      }
    }
    const body = {
      message: "Update plan — " + new Date().toISOString().slice(0,16).replace("T"," "),
      content: b64std(JSON.stringify(S, null, 2)),
      branch: sync.branch
    };
    if(remoteSha) body.sha = remoteSha;
    const r = await fetch(ghUrl(), {method:"PUT", headers:ghHeaders(), body:JSON.stringify(body)});
    if(!r.ok){
      const j = await r.json().catch(function(){ return {}; });
      throw new Error(j.message || ("HTTP "+r.status));
    }
    const j = await r.json();
    remoteSha = j.content && j.content.sha;
    S.baseSig = sigOf(S);
    writeLocal();
    setSync("ok");
  }catch(e){
    setSync("err", e.message);
  }
}
let syncReady = false, pushPending = false;
function schedulePush(){
  if(!sync.token) return;
  if(!syncReady){ pushPending = true; setSync("dirty"); return; }
  clearTimeout(pushT);
  setSync("dirty");
  pushT = setTimeout(pushRemote, 2000);
}
function setSync(st, msg){
  syncState = st;
  const el = document.getElementById("syncNote");
  if(!el) return;
  if(!sync.token){
    const r = {"reader-synced":"Aktueller Stand", "reader-local":"Nur auf diesem Gerät gespeichert",
               "reader":"", "reader-none":""};
    const t = r[st];
    el.innerHTML = t ? '<span class="dot"></span> '+t : "";
    return;
  }
  const m = {idle:"Sync bereit", dirty:"Änderung gemerkt…", saving:"Wird hochgeladen…",
             ok:"Auf allen Geräten", err:"Sync-Fehler"+(msg?" ("+esc(msg)+")":"")};
  el.innerHTML = '<span class="dot '+(st==="err"?"err":"sync")+'"></span> '+(m[st]||"");
}
let lastSyncAt = 0;
function adopt(remote){
  const v = S.view;
  S = remote;
  S.view = v;
  S.baseSig = sigOf(remote);
  writeLocal();
  applyView(); render(); loadWeather();
}
function finishSync(){
  syncReady = true;
  if(pushPending){ pushPending = false; schedulePush(); }
}
function reconcile(remote){
  const rs = sigOf(remote), ls = sigOf(S), bs = S.baseSig;

  if(rs === ls){                      // already agree
    S.baseSig = rs; writeLocal();
    setSync(sync.token ? "ok" : "reader-synced"); finishSync(); return;
  }
  if(bs && ls === bs){                // untouched here, moved there
    adopt(remote); toast("Neuer Stand geladen");
    setSync(sync.token ? "ok" : "reader-synced"); finishSync(); return;
  }
  if(bs && rs === bs){                // edited here, unchanged there
    finishSync();
    if(sync.token) pushRemote(); else setSync("reader-local");
    return;
  }
  if(!bs){                            // no baseline yet — never clobber the repo
    if((remote.updatedAt || 0) >= (S.updatedAt || 0)){
      adopt(remote); toast("Neuer Stand geladen");
      setSync(sync.token ? "ok" : "reader-synced"); finishSync(); return;
    }
    finishSync(); offerRemote(remote); return;
  }
  finishSync(); offerRemote(remote);  // both moved
}
async function initialSync(){
  lastSyncAt = Date.now();
  let remote = null;
  try{ remote = await pullRemote(); }
  catch(e){ setSync("err", e.message); finishSync(); return; }
  if(!remote){
    finishSync();
    if(sync.token){ setSync("idle"); pushRemote(); }
    return;
  }
  if(!stored && !S.baseSig){
    adopt(remote); setSync(sync.token ? "ok" : "reader-synced"); finishSync(); return;
  }
  reconcile(remote);
}
function offerRemote(remote){
  const b = document.getElementById("banner");
  document.getElementById("bannerTxt").textContent =
    "Der veröffentlichte Plan ist neuer als deine Version auf diesem Gerät. Ohne Sync-Token bleiben deine Änderungen nur hier.";
  b.classList.add("on");
  document.getElementById("bLoad").onclick = function(){
    adopt(remote); b.classList.remove("on");
    setSync(sync.token ? "ok" : "reader-synced"); toast("Aktueller Plan geladen");
  };
  document.getElementById("bKeep").onclick = function(){
    b.classList.remove("on");
    if(sync.token) pushRemote(); else setSync("reader-local");
  };
}

/* ================= dates ================= */
const DOW = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MON = ["Jänner","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONS = ["Jän","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const parse = s => { const a = s.split("-").map(Number); return new Date(Date.UTC(a[0],a[1]-1,a[2])); };
const fmt = dt => dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0");
const addD = (s,n) => fmt(new Date(parse(s).getTime() + n*864e5));
const dowOf = s => parse(s).getUTCDay();
const dayNum = s => parse(s).getUTCDate();
const monOf = s => parse(s).getUTCMonth();
const diffD = (a,b) => Math.round((parse(b)-parse(a))/864e5);

function dateList(){
  if(parse(S.end) < parse(S.start)) return [S.start];
  const out = []; let d = S.start, g = 0;
  while(parse(d) <= parse(S.end) && g++ < 400){ out.push(d); d = addD(d,1); }
  return out;
}
const _n = new Date();
const TODAY = _n.getFullYear()+"-"+String(_n.getMonth()+1).padStart(2,"0")+"-"+String(_n.getDate()).padStart(2,"0");

function get(iso){ return S.days[iso] || {}; }
function set(iso, patch){
  const cur = Object.assign({}, S.days[iso] || {}, patch);
  Object.keys(cur).forEach(function(k){
    const v = cur[k];
    if(v === "" || v === false || v == null || (Array.isArray(v) && !v.length)) delete cur[k];
  });
  if(Object.keys(cur).length) S.days[iso] = cur; else delete S.days[iso];
}
function personById(id){ return S.people.filter(function(p){ return p.id===id; })[0]; }

function wxPrev(iso){
  const all = dateList(); let i = all.indexOf(iso) - 1;
  for(; i>=0; i--){ const x = get(all[i]); if(x.to) return x.to; if(x.place) return x.place; }
  return S.base;
}
function wxPlace(iso){
  const x = get(iso);
  if(x.to) return x.to;
  if(x.place) return x.place;
  return wxPrev(iso);
}
function itemsOf(iso){ return get(iso).items || []; }
function setItems(iso, arr){ set(iso, {items: arr.slice()}); }
function itemDays(id){
  return dateList().filter(function(iso){
    return itemsOf(iso).some(function(z){ return z.id === id; });
  });
}
function findItem(id){
  const d = itemDays(id)[0];
  if(!d) return null;
  return itemsOf(d).filter(function(z){ return z.id === id; })[0];
}
function addItem(iso, obj, span){
  const it = {id: obj.id || uid(), t: obj.t, k: obj.k || "any"};
  const all = dateList(), start = all.indexOf(iso);
  if(start < 0) return null;
  const n = Math.max(1, Math.min(span || 1, all.length - start));
  for(let k = 0; k < n; k++){
    const d = all[start + k], arr = itemsOf(d).slice();
    if(!arr.some(function(z){ return z.id === it.id; })) arr.push(Object.assign({}, it));
    setItems(d, arr);
  }
  return it.id;
}
function removeItem(id){
  dateList().forEach(function(iso){
    const cur = itemsOf(iso);
    const arr = cur.filter(function(z){ return z.id !== id; });
    if(arr.length !== cur.length) setItems(iso, arr);
  });
}
function setSpan(id, n){
  const it = findItem(id), start = itemDays(id)[0];
  if(!it || !start) return;
  removeItem(id);
  addItem(start, it, n);
}

function blocks(){
  const out = []; let cur = null;
  dateList().forEach(function(iso){
    if(get(iso).frei){ if(!cur){ cur = {from:iso,to:iso}; out.push(cur); } else cur.to = iso; }
    else cur = null;
  });
  return out;
}
function blockOf(iso){ return blocks().filter(function(b){ return iso>=b.from && iso<=b.to; })[0]; }

const WXL = {clear:"Sonnig",mostly:"Meist sonnig",partly:"Teils bewölkt",cloud:"Bedeckt",fog:"Nebel",drizzle:"Nieselregen",rain:"Regen",snow:"Schnee",storm:"Gewitter"};
function wxKind(c){
  if(c===0) return "clear"; if(c===1) return "mostly"; if(c===2) return "partly"; if(c===3) return "cloud";
  if(c===45||c===48) return "fog"; if(c>=51&&c<=57) return "drizzle";
  if((c>=61&&c<=67)||(c>=80&&c<=82)) return "rain";
  if((c>=71&&c<=77)||c===85||c===86) return "snow";
  if(c>=95) return "storm"; return "cloud";
}
const CA="#E0A458", CI="#9A9A95", CP="#0E7C74";
function wxIcon(kind,size){

    case "drizzle":return '<svg '+o+'><g transform="translate(0,-1.6)">'+cl()+'</g><g stroke="'+CP+'"><path d="M9 18.4l-.8 2.4M13 18.4l-.8 2.4"/></g></svg>';
    case "rain":   return '<svg '+o+'><g transform="translate(0,-1.8)">'+cl(CP)+'</g><g stroke="'+CP+'"><path d="M8.4 18.2l-1.1 3M12 18.2l-1.1 3M15.6 18.2l-1.1 3"/></g></svg>';
    case "snow":   return '<svg '+o+'><g transform="translate(0,-1.8)">'+cl()+'</g><g stroke="'+CP+'"><path d="M8.6 19.4v2.4M7.5 20h2.2M14.2 19.4v2.4M13.1 20h2.2"/></g></svg>';
    case "storm":  return '<svg '+o+'><g transform="translate(0,-1.8)">'+cl()+'</g><path d="M12.6 17.6l-3 3.6h2.4l-.9 2.6 3.1-3.8h-2.3z" stroke="'+CA+'" fill="'+CA+'" fill-opacity=".4"/></svg>';
    default:       return '<svg '+o+'>'+cl()+'</svg>';
  }
}

const weather = {};
let wxErr = "";

function planPlaces(){
  const s = {};
  dateList().forEach(function(iso){ const n = wxPlace(iso); if(n && S.places[n]) s[n] = 1; });
  return Object.keys(s);
}
function usedPlaces(){
  const s = {};
  planPlaces().forEach(function(n){ s[n] = 1; });
  (S.pins || []).forEach(function(n){ if(S.places[n]) s[n] = 1; });
  return Object.keys(s);
}
function missingPlaces(){
  const s = {};
  dateList().forEach(function(iso){ const n = wxPlace(iso); if(n && !S.places[n]) s[n] = 1; });
  return Object.keys(s);
}
async function geocode(name){
  const u = "https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(name)+"&count=1&language=de&format=json";
  const r = await fetch(u);
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j = await r.json();
  if(!j.results || !j.results.length) throw new Error("nicht gefunden");
  return {lat:j.results[0].latitude, lon:j.results[0].longitude};
}
async function ensurePlaces(){
  const miss = missingPlaces();
  for(let i=0;i<miss.length;i++){
    const n = miss[i];
    try{ S.places[n] = await geocode(n); save(); toast(n+" gefunden"); }catch(e){}
  }
}
function wxWindow(){
  const t = new Date();
  const base = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
  const maxEnd = fmt(new Date(base + 15*864e5));
  const minStart = fmt(new Date(base - 60*864e5));
  const start = S.start < minStart ? minStart : S.start;
  const end   = S.end   > maxEnd   ? maxEnd   : S.end;
  return start > end ? null : {start:start, end:end};
}
async function loadWeather(){
  setNote("loading");
  wxErr = "";
  try{ await ensurePlaces(); }catch(e){}
  const win = wxWindow();
  const names = usedPlaces();
  if(!win){ setNote("window"); render(); return; }
  if(!names.length){ setNote("none"); render(); return; }

  const results = await Promise.all(names.map(function(n){
    const p = S.places[n];
    const u = "https://api.open-meteo.com/v1/forecast?latitude="+p.lat+"&longitude="+p.lon
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,precipitation_hours"
      + "&timezone=Europe%2FVienna&start_date="+win.start+"&end_date="+win.end;
    return fetch(u)
      .then(function(r){ return r.json().then(function(j){
          if(!r.ok) throw new Error(j && j.reason ? j.reason : "HTTP "+r.status);
          return j; }); })
      .then(function(j){ return {n:n, j:j}; })
      .catch(function(e){ return {n:n, err:(e && e.message) || "Netzwerkfehler"}; });
  }));

  let ok = 0;
  results.forEach(function(res){
    if(res.err){ wxErr = wxErr || res.err; return; }
    const dd = res.j && res.j.daily; if(!dd) return;
    const b = weather[res.n] = {};
    dd.time.forEach(function(t,k){
      if(dd.temperature_2m_max[k]==null) return;
      b[t] = {c:dd.weather_code[k], max:Math.round(dd.temperature_2m_max[k]),
              min:Math.round(dd.temperature_2m_min[k]),
              pp:dd.precipitation_probability_max ? dd.precipitation_probability_max[k] : null,
              sum:dd.precipitation_sum ? dd.precipitation_sum[k] : null,
              hours:dd.precipitation_hours ? dd.precipitation_hours[k] : null};
    });
    ok++;
  });
  setNote(ok ? (ok===names.length ? "live" : "partial") : "error");
  render();
}
function setNote(st){

  if(st==="live")        el.innerHTML = '<span class="dot live"></span> Wetter live · '+n+' Orte <button type="button" id="reload">neu laden</button>';
  else if(st==="partial")el.innerHTML = '<span class="dot err"></span> Wetter teilweise geladen <button type="button" id="reload">nochmal</button>';
  else if(st==="none")   el.innerHTML = '<span class="dot"></span> Kein Ort mit Koordinaten <button type="button" id="reload">nochmal</button>';
  else if(st==="window") el.innerHTML = '<span class="dot"></span> Zeitraum außerhalb der Vorhersage';

function wxFor(iso){ const b = weather[wxPlace(iso)]; return b ? b[iso] : null; }

/* ================= render ================= */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });

function placeCell(iso){
  const x = get(iso);
  if(x.to) return '<span class="place">'+esc(x.place||wxPrev(iso))+' <span class="arrow">→</span> '+esc(x.to)+'</span>';
  if(x.place) return '<span class="place">'+esc(x.place)+'</span>';

}
function whatCell(iso){

  if(!arr.length) return "";
  const all = dateList(), i = all.indexOf(iso);
  const prev = i > 0 ? itemsOf(all[i-1]) : [];

function tagsHTML(iso){

  if(x.mode==="TA")   h += '<span class="tag ta">TA</span>';

/* a day counts as wet if it is likely to rain for a meaningful stretch,
   not merely if a shower is possible */
function isWet(w){
  if(!w) return false;
  if(w.hours != null && w.hours >= 4) return true;
  if(w.sum   != null && w.sum   >= 4) return true;
  /* a near-certain but brief shower is not a day indoors, however
     alarming the percentage looks on its own */
  if(w.hours != null && w.hours < 2) return false;
  return (w.pp != null && w.pp >= 60);
}
/* Three bars for duration: under 2 h, 2-6 h, 6 h and over. Probability
   says whether it rains, this says whether it rains all day. */
function rainBars(h){
  if(h == null || h < 1) return "";
  const n = h >= 6 ? 3 : (h >= 2 ? 2 : 1);
  let out = '<span class="mtr" aria-hidden="true">';
  for(let i = 0; i < 3; i++) out += '<i'+(i < n ? ' class="on"' : '')+'></i>';
  return out + '</span>';
}
function rainWord(w){
  const h = w && w.hours;
  if(h == null || h < 1) return "kaum Regen";
  if(h < 2) return "kurzer Schauer";
  if(h < 6) return Math.round(h)+" Std. Regen";
  return "Dauerregen, "+Math.round(h)+" Std.";
}
function rainChip(w, full){
  if(!w) return "";
  const pp = w.pp || 0;
  const hrs = w.hours || 0;
  if(pp <= 0 && !(w.sum > 0)) return "";
  const lvl = isWet(w) ? "hi" : (pp >= 25 ? "mid" : "lo");
  const extra = (full && hrs >= 2) ? '<span class="rh"> · '+Math.round(hrs)+' h</span>' : "";
  return '<span class="rain '+lvl+'" title="'+pp+' % · '+rainWord(w)+'">'
    + pp + '%' + extra + rainBars(hrs) + '</span>';
}
function wxHTML(iso, full){
  const w = wxFor(iso);
  if(!w) return '<span class="wx empty"><span class="t">—</span></span>';
  return '<span class="wx">'+wxIcon(wxKind(w.c))+'<span class="t">'+w.max+'°</span>'
    + '<span class="tmin">'+w.min+'°</span>'+rainChip(w, full)+'</span>';
}
function rainLine(w){
  if(!w) return "";
  const bits = [];
  if(w.pp != null)  bits.push(w.pp + " % Regenwahrscheinlichkeit");
  if(w.sum != null && w.sum > 0) bits.push(String(w.sum).replace(".", ",") + " mm");
  if(w.hours != null && w.hours > 0) bits.push("Regen über " + Math.round(w.hours) + " Std.");
  if(!bits.length) return "Kein Niederschlag erwartet.";
  return bits.join(" · ") + (isWet(w) ? " — eher ein Indoor-Tag." : " — im Wesentlichen trocken.");
}
function hlCls(iso, weekAware){
  const b = blockOf(iso); if(!b) return "";
  let c = " frei"; const dw = dowOf(iso);
  if(iso===b.from || (weekAware && dw===1)) c += " hl-start";
  if(iso===b.to   || (weekAware && dw===0)) c += " hl-end";
  return c;
}
const isPast = iso => iso < TODAY;

function render(){
  document.getElementById("title").textContent = S.title;
  document.getElementById("subtitle").textContent = S.subtitle;
  const a = parse(S.start), b = parse(S.end);
  const same = monOf(S.start)===monOf(S.end) && a.getUTCFullYear()===b.getUTCFullYear();
  document.getElementById("range").textContent = same
    ? a.getUTCDate()+".–"+b.getUTCDate()+". "+MON[monOf(S.end)]+" "+b.getUTCFullYear()
    : a.getUTCDate()+". "+MON[monOf(S.start)]+" – "+b.getUTCDate()+". "+MON[monOf(S.end)]+" "+b.getUTCFullYear();

}
function dayLabel(iso, all){

  return first ? DOW[dowOf(iso)]+" · "+MONS[monOf(iso)] : DOW[dowOf(iso)];

function renderWeeks(){

/* rows: pinned places first, then anywhere the plan actually takes you */
function compareRows(){
  const pins = (S.pins || []).filter(function(n){ return S.places[n]; });
  const plan = planPlaces().filter(function(n){ return pins.indexOf(n) < 0; });
  return pins.map(function(n){ return {n:n, pin:true}; })
    .concat(plan.sort().map(function(n){ return {n:n, pin:false}; }));
}
function compareDays(){
  const win = wxWindow();
  if(!win) return [];
  return dateList().filter(function(iso){ return iso >= win.start && iso <= win.end; });
}
function renderCompare(){
  const rows = compareRows(), days = compareDays();
  const el = document.getElementById("places");
  if(!rows.length || !days.length){
    el.innerHTML = '<p class="hint">Noch keine Vorhersage. Orte anheften unter Einstellungen → Orte.</p>';
    return;
  }
  let h = '<div class="wxgrid"><table class="wxt"><thead><tr><th class="ph"></th>';
  days.forEach(function(iso){
    h += '<th class="dh'+(iso===TODAY?" today":"")+'"><span class="dw">'+DOW[dowOf(iso)]+'</span>'
       + '<span class="dn">'+dayNum(iso)+'</span></th>';
  });
  h += '</tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr><th class="ph"><span class="phi">'
       + '<button type="button" class="pinbtn'+(r.pin?" on":"")+'" data-pin="'+esc(r.n)+'"'
       + ' title="'+(r.pin?"Nicht mehr anheften":"Anheften")+'" aria-label="'+(r.pin?"Nicht mehr anheften":"Anheften")+'">'
       + pinIcon() + '</button><span class="pn">'+esc(r.n)+'</span></span></th>';
    days.forEach(function(iso){
      const b = weather[r.n], w = b ? b[iso] : null;
      const here = wxPlace(iso) === r.n;
      const dim  = !r.pin && !here;
      if(!w){ h += '<td class="wc empty">·</td>'; return; }
      const pp = w.pp || 0;
      const lvl = isWet(w) ? "hi" : (pp >= 25 ? "mid" : "lo");
      h += '<td class="wc'+(here?" here":"")+(dim?" dim":"")+(iso===TODAY?" today":"")+'"'
         + ' title="'+esc(r.n)+' · '+WXL[wxKind(w.c)]+' · '+pp+' % · '+rainWord(w)+'">'
         + wxIcon(wxKind(w.c), 20)
         + '<span class="ct">'+w.max+'°</span>'
         + '<span class="cr '+lvl+'">'+pp+rainBars(w.hours)+'</span></td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>'
     + '<p class="hint" style="margin-top:14px">Umrandet = dein geplanter Ort an diesem Tag. Die Zahl unter der Temperatur ist die Regenwahrscheinlichkeit in Prozent. Über die Nadel heftest du einen Ort dauerhaft an; nicht angeheftete Orte sind an Tagen, an denen du nicht dort bist, gedämpft.</p>';
  el.innerHTML = h;
}

/* which of your own ideas suit this day's weather */
function recsFor(iso){
  const w = wxFor(iso);
  if(!w) return [];
  const wet = isWet(w);
  return S.ideas.map(function(o,i){ return {o:o, i:i}; })
    .filter(function(r){ return r.o.k === "any" || (wet ? r.o.k === "in" : r.o.k === "out"); })
    .slice(0,4);
}

/* ================= drag & drop ================= */
let dragging = null, ghost = null, hot = null, blockClick = false;

document.addEventListener("pointerdown", function(e){
  const h = e.target.closest("[data-drag]");
  if(!h) return;
  if(e.button && e.button !== 0) return;
  const startX = e.clientX, startY = e.clientY;
  let live = false;
  function move(ev){
    if(!live){
      if(Math.abs(ev.clientX-startX) + Math.abs(ev.clientY-startY) < 7) return;
      live = true; beginDrag(h);
    }
    ev.preventDefault();
    moveDrag(ev.clientX, ev.clientY);
  }
  function up(ev){
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
    if(live){
      /* Suppress the click the browser fires after a drag — but only
         briefly. If no click follows (drop landed on a different
         element than the press), a sticky flag would eat the next
         real tap. */
      blockClick = true;
      setTimeout(function(){ blockClick = false; }, 300);
      endDrag(ev.clientX, ev.clientY);
    }
  }
  window.addEventListener("pointermove", move, {passive:false});
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
}, true);

function beginDrag(h){
  const type = h.dataset.drag;
  let text, kind;
  if(type === "idea"){ text = S.ideas[+h.dataset.i].t; kind = S.ideas[+h.dataset.i].k; }
  else { const it = findItem(h.dataset.id); text = it ? it.t : ""; kind = it ? it.k : "any"; }
  dragging = {type:type, text:text, kind:kind, i:h.dataset.i, iso:h.dataset.iso, id:h.dataset.id};
  ghost = document.createElement("div");
  ghost.className = "ghost";
  ghost.textContent = text || "";
  document.body.appendChild(ghost);
  document.body.classList.add("dragging");
}
function moveDrag(x,y){
  if(ghost){ ghost.style.left = x+"px"; ghost.style.top = y+"px"; }
  const el = document.elementFromPoint(x,y);
  const t = el && el.closest('[data-drop="day"], #ideasPanel');
  if(t !== hot){
    if(hot) hot.classList.remove("drop-hot");
    hot = t;
    if(hot) hot.classList.add("drop-hot");
  }
}
function endDrag(x,y){
  const el = document.elementFromPoint(x,y);
  const target = el && el.closest('[data-drop="day"], #ideasPanel');
  if(hot) hot.classList.remove("drop-hot");
  if(ghost) ghost.remove();
  ghost = null; hot = null;
  document.body.classList.remove("dragging");
  const d = dragging; dragging = null;
  if(!d || !target) return;

  if(target.id === "ideasPanel"){
    if(d.type === "item"){
      const it = findItem(d.id);
      S.ideas.push({t:d.text, k:(it && it.k) || "any"});
      removeItem(d.id);
      saved("Zurück in den Ideen");
      render();
    }
    return;
  }
  const iso = target.dataset.iso;
  if(!iso) return;
  if(d.type === "idea"){
    addItem(iso, {t:d.text, k:d.kind}, 1);
    S.ideas.splice(+d.i, 1);
    saved(dayNum(iso)+"."+(monOf(iso)+1)+". · "+d.text);
    render();
  } else if(d.type === "item"){
    const it = findItem(d.id);
    if(!it) return;
    const span = itemDays(d.id).length;
    if(itemDays(d.id)[0] === iso) return;
    removeItem(d.id);
    addItem(iso, it, span);
    saved("Verschoben auf "+dayNum(iso)+".");
    render();
  }
}

  const blockLen = b ? diffD(b.from,b.to)+1 : 0;
  const knownPlaces = Object.keys(S.places).sort(function(a,b){ return a.localeCompare(b,"de"); });
  const picker = function(id, label, val, ph){
    return '<div class="f"><label for="'+id+'">'+label+'</label><div class="pick">'
      + '<input type="text" id="'+id+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'" autocomplete="off">'
      + '<button type="button" class="pick-btn" data-pick="'+id+'" aria-label="Ort wählen">▾</button>'
      + '<div class="pick-list" data-list="'+id+'" hidden>'
      + '<button type="button" class="pick-opt clear" data-for="'+id+'" data-val="">— leer —</button>'
      + knownPlaces.map(function(n){
          return '<button type="button" class="pick-opt" data-for="'+id+'" data-val="'+esc(n)+'">'+esc(n)+'</button>';
        }).join("")
      + '</div></div></div>';
  };
  const itemList = function(d){
    const arr = itemsOf(d);
    if(!arr.length) return "";
    return '<div class="items">' + arr.map(function(it){
      const days = itemDays(it.id), sp = days.length, pos = days.indexOf(d) + 1;
      const maxLeft = dateList().length - dateList().indexOf(days[0]);
      return '<div class="item-row">'
        + '<span class="item-t">'+esc(it.t)
        + (sp > 1 ? '<small>'+dayNum(days[0])+'.–'+dayNum(days[sp-1])+'. · Tag '+pos+' von '+sp+'</small>' : '')
        + '</span>'
        + '<span class="span-ctl">'
        + '<button type="button" data-spandn="'+it.id+'"'+(sp<=1?" disabled":"")+' aria-label="Kürzer">−</button>'
        + '<span class="n">'+sp+(sp===1?" Tag":" Tage")+'</span>'
        + '<button type="button" data-spanup="'+it.id+'"'+(sp>=maxLeft?" disabled":"")+' aria-label="Länger">+</button>'
        + '</span>'
        + '<button type="button" class="item-del" data-itemdel="'+it.id+'" aria-label="Entfernen">✕</button>'
        + '</div>';
    }).join("") + '</div>';
  };

    ? '<div class="sh-wx">'+wxIcon(wxKind(w.c),40)+'<div><div class="big">'+w.max+'° <span style="font-size:15px;color:var(--text-2);font-weight:600">/ '+w.min+'°</span> '+rainChip(w,true)+'</div>'
      + '<div class="meta">'+WXL[wxKind(w.c)]+' in '+esc(wxPlace(iso))
      + (x.to ? ' <span style="color:var(--text-3)">(Ziel)</span>' : '')
      + '<br>'+rainLine(w)+'</div></div></div>'
    : '<div class="sh-wx"><div class="meta">Keine Vorhersage für '+esc(wxPlace(iso))+' — außerhalb des 16-Tage-Fensters oder Ort ohne Koordinaten.</div></div>';

    return '<button class="rec'+(plain?" plain":"")+'" type="button" data-rec="'+r.i+'" data-iso="'+iso+'">'
      + '<span class="k">'+kindIcon(r.o.k)+'</span>'+esc(r.o.t)+'</button>';
  };
  const recBox = recs.length
    ? '<div class="f"><span class="fl">Passt zu diesem Wetter</span><div class="chips">'
      + recs.map(function(r){ return chip(r, false); }).join("") + '</div></div>'
    : "";

  recs.forEach(function(r){ shownRec[r.i] = 1; });
  const rest = S.ideas.map(function(o,i){ return {o:o, i:i}; })
                      .filter(function(r){ return !shownRec[r.i]; });

    ? '<div class="f"><button type="button" class="disclose" id="allIdeas" aria-expanded="'+(allOpen?"true":"false")+'">'

      + '<button class="chip" type="button" data-m="TA" aria-pressed="'+(x.mode==="TA")+'">TA</button>'
      + '<button class="chip" type="button" data-m="ZA" aria-pressed="'+(x.mode==="ZA")+'">ZA</button>'
      + '<button class="chip" type="button" data-m="Büro" aria-pressed="'+(x.mode==="Büro")+'">Büro</button>'
      + '<button class="chip" type="button" data-t="offen" aria-pressed="'+(!!x.offen)+'">Offen</button></div></div>'
    + '<div class="f2">'
      + picker("fPlace", "Wo", x.place||"", wxPlace(iso))
      + picker("fTo", "Weiter nach", x.to||"", "—") + '</div>'
    + '<div class="f"><span class="fl">Was</span>'+itemList(iso)
      + '<input type="text" id="fWhat" value="" placeholder="Eintrag hinzufügen und Enter"></div>'
    + '<div class="f"><span class="fl">Wer</span><div class="chips">'
      + S.people.map(function(p){
          return '<button class="chip" type="button" data-who="'+esc(p.id)+'" aria-pressed="'+((x.who||[]).indexOf(p.id)>=0)+'">'
            + '<span class="p" style="background:'+esc(p.c)+'">'+esc(p.id[0])+'</span>'+esc(p.name)+'</button>';
        }).join("")

      + '</div></div>'
    + '<p class="hint">Das Wetter folgt dem Ort des Tages — ohne Eintrag gilt der letzte bekannte Ort. Neue Orte werden automatisch geokodiert.</p>'
    + recBox
    + allBox
    + '<div class="sh-foot"><button class="linkbtn" type="button" id="clearD">Tag leeren</button>'
    + '<button class="linkbtn go" type="button" id="doneD">Fertig</button></div>';

  openSheet();
  const refresh = function(reweather){ saved(); render(); if(reweather) loadWeather(); openDay(openIso); };

  const ai = sheet.querySelector("#allIdeas");
  if(ai) ai.onclick = function(){
    allOpen = !allOpen;
    ai.setAttribute("aria-expanded", allOpen ? "true" : "false");
    sheet.querySelector("#allIdeasBox").style.display = allOpen ? "" : "none";
  };
  sheet.querySelector("#closeD").onclick = closeSheet;
  sheet.querySelector("#doneD").onclick = closeSheet;
  sheet.querySelector("#prevD").onclick = function(){ if(i>0) openDay(all[i-1]); };
  sheet.querySelector("#nextD").onclick = function(){ if(i<all.length-1) openDay(all[i+1]); };
  sheet.querySelector("#clearD").onclick = function(){ delete S.days[iso]; refresh(true); };
  sheet.querySelectorAll("[data-m]").forEach(function(btn){
    btn.onclick = function(){ const m = btn.dataset.m; set(iso,{mode: get(iso).mode===m ? "" : m}); refresh(false); };
  });
  sheet.querySelectorAll("[data-t]").forEach(function(btn){
    btn.onclick = function(){ const t = btn.dataset.t, p = {}; p[t] = !get(iso)[t]; set(iso,p); refresh(false); };
  });
  sheet.querySelectorAll("[data-who]").forEach(function(btn){
    btn.onclick = function(){ toggleWho(iso, btn.dataset.who); refresh(false); };
  });
  sheet.querySelector("#addWho").onclick = function(){
    const id = addPerson();
    if(id){ toggleWho(iso, id); refresh(false); }
  };
  const bindText = function(sel, field, reweather){
    const el = sheet.querySelector(sel);
    el.onchange = function(){ const p = {}; p[field] = el.value.trim(); set(iso,p); saved(); render(); if(reweather) loadWeather(); };
    el.onkeydown = function(e){ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } };
  };
  bindText("#fPlace","place",true);
  bindText("#fTo","to",true);

  const wi = sheet.querySelector("#fWhat");
  wi.onkeydown = function(e){
    if(e.key !== "Enter") return;
    e.preventDefault();
    const t = wi.value.trim();
    if(!t) return;
    addItem(iso, {t:t, k:"any"}, 1);
    wi.value = "";
    saved(); render(); openDay(iso);
  };

  sheet.querySelectorAll("[data-pick]").forEach(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      const box = sheet.querySelector('[data-list="'+btn.dataset.pick+'"]');

      sheet.querySelectorAll(".pick-list").forEach(function(l){ l.hidden = true; });

  sheet.querySelectorAll("[data-spandn]").forEach(function(b2){

function toggleWho(iso, id){
  const cur = (get(iso).who||[]).slice();
  const k = cur.indexOf(id);
  if(k>=0) cur.splice(k,1); else cur.push(id);
  cur.sort(function(p,q){
    return S.people.findIndex(function(z){return z.id===p;}) - S.people.findIndex(function(z){return z.id===q;});
  });
  set(iso,{who:cur});
}
function addPerson(){
  const name = prompt("Name?");
  if(!name || !name.trim()) return null;
  const first = name.trim()[0].toUpperCase();
  let id = first, n = 1;
  while(S.people.some(function(p){ return p.id===id; })){ n++; id = first + n; }
  const pal = ["#3D5A80","#C1666B","#0E7C74","#7D6B9E","#5B8C6E","#C08552","#A6799B","#D08C60","#6B8E9E","#8A7F5C"];
  S.people.push({id:id, name:name.trim(), c:pal[S.people.length % pal.length]});
  save();
  return id;
}

              + '<button type="button" class="pinbtn'+(on?" on":"")+'" data-pin="'+esc(n)+'" aria-label="Anheften">'+pinIcon()+'</button>'
              + '<span class="nm">'+esc(n)+'</span>'
              + '<span class="co">'+p2.lat.toFixed(2)+', '+p2.lon.toFixed(2)+'</span>'
              + '<button class="item-del" type="button" data-pldel="'+esc(n)+'" aria-label="Entfernen">✕</button></div>';
          }).join("")
        : '<p class="hint">Noch keine Orte.</p>')
    + '</div><p class="hint" style="margin-top:10px">Angeheftete Orte stehen immer im Vergleich unter <b>Orte</b>, auch wenn du gar nicht hinfährst. Orte landen hier automatisch: sobald du einen Namen bei <b>Wo</b> oder <b>Weiter nach</b> einträgst, wird er geokodiert und steht danach im Dropdown. Entfernen löscht nur die Koordinaten — steht der Name noch an einem Tag, wird er beim nächsten Laden neu gesucht.</p></div>'
    + '<div class="f"><label for="sTok">Sync-Token (nur auf deinen Geräten)</label>'
    + '<input type="password" id="sTok" value="'+esc(sync.token)+'" placeholder="github_pat_… — leer lassen zum Mitlesen" autocomplete="off"></div>'
    + '<div class="f"><span class="fl">Sync</span><div class="chips">'
    + '<button class="chip" type="button" id="pullNow">Jetzt holen</button>'
    + '<button class="chip" type="button" id="pushNow">Jetzt hochladen</button></div>'
    + '<p class="hint" style="margin-top:12px">Mit Token schreibt dieses Gerät den Plan nach <b>'+esc(sync.repo)+'/'+esc(sync.path)+'</b>; deine anderen Geräte holen ihn beim Öffnen. Ohne Token liest das Gerät nur mit — genau das bekommt die Familie über den normalen Link.</p></div>'
    + '<div class="f"><span class="fl">Plan teilen &amp; sichern</span><div class="chips">'
    + '<button class="chip" type="button" id="shareJ">Link kopieren</button>'
    + '<button class="chip" type="button" id="expJ">Export</button>'
    + '<button class="chip" type="button" id="impJ">Import</button>'
    + '<button class="chip" type="button" id="resetJ">Zurücksetzen</button></div>'
    + '<p class="hint" style="margin-top:12px">'
    + (canPersist
        ? "Dein Plan liegt nur auf diesem Gerät. <b>Link kopieren</b> packt den ganzen Plan in eine URL — wer sie öffnet, bekommt deinen Stand. <b>Export</b> speichert dieselben Daten als Datei."
        : "Speichern im Browser ist hier blockiert — Änderungen gelten nur für diese Sitzung. Nimm Link oder Export, um sie zu sichern.")
    + '</p></div>'
    + '<div class="sh-foot"><span class="hint">'+dateList().length+' Tage</span>'
    + '<button class="linkbtn go" type="button" id="doneS">Fertig</button></div>';
  openSheet();

  sheet.querySelector("#closeS").onclick = closeSheet;
  sheet.querySelector("#doneS").onclick = closeSheet;
  const st = sheet.querySelector("#sStart"), en = sheet.querySelector("#sEnd");
  st.onchange = function(){ if(st.value){ S.start = st.value; if(S.end < S.start) S.end = S.start; } saved(); render(); loadWeather(); openSettings(); };
  en.onchange = function(){ if(en.value){ S.end = en.value; if(S.end < S.start) S.start = S.end; } saved(); render(); loadWeather(); openSettings(); };
  sheet.querySelector("#sBase").onchange = function(e){ S.base = e.target.value.trim() || "Steyr"; saved(); render(); loadWeather(); };

  sheet.querySelectorAll("[data-pc]").forEach(function(el){ el.onchange = function(){ S.people[+el.dataset.pc].c = el.value; saved(); render(); }; });
  sheet.querySelectorAll("[data-pn]").forEach(function(el){ el.onchange = function(){ S.people[+el.dataset.pn].name = el.value.trim()||"?"; saved(); render(); }; });
  sheet.querySelectorAll("[data-pd]").forEach(function(el){
    el.onclick = function(){
      const i = +el.dataset.pd, id = S.people[i].id;
      S.people.splice(i,1);
      Object.keys(S.days).forEach(function(k){
        const w = S.days[k].who;
        if(w){ S.days[k].who = w.filter(function(z){ return z!==id; }); if(!S.days[k].who.length) delete S.days[k].who; }
      });
      saved(); render(); openSettings();
    };
  });
  sheet.querySelector("#addPerson").onclick = function(){ if(addPerson()){ saved(); render(); openSettings(); } };
  sheet.querySelectorAll("[data-pldel]").forEach(function(el){
    el.onclick = function(){ delete S.places[el.dataset.pldel]; saved("Ort entfernt"); render(); openSettings(); };
  });
  sheet.querySelector("#sTok").onchange = function(e){
    sync.token = e.target.value.trim(); saveSync(); remoteSha = null;
    setSync(sync.token ? "idle" : "reader");
    toast(sync.token ? "Sync aktiv" : "Sync aus");
  };
  sheet.querySelector("#pullNow").onclick = async function(){
    try{
      const r = await pullRemote();
      if(!r){ toast("Noch kein plan.json"); return; }
      adopt(r); setSync(sync.token ? "ok" : "reader-synced"); toast("Geholt");
    }catch(e){ toast("Fehler: "+e.message); }
  };
  sheet.querySelector("#pushNow").onclick = function(){ pushRemote().then(function(){ toast("Hochgeladen"); }); };

  sheet.querySelector("#shareJ").onclick = function(){
    const url = location.origin + location.pathname + "#plan=" + b64enc(JSON.stringify(S));
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast("Link kopiert"); },
        function(){ prompt("Link kopieren:", url); });
    } else { prompt("Link kopieren:", url); }
  };
  sheet.querySelector("#expJ").onclick = function(){
    const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (S.title||"plan").toLowerCase().replace(/[^a-z0-9]+/g,"-")+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast("Exportiert");
  };
  sheet.querySelector("#impJ").onclick = function(){ document.getElementById("fileIn").click(); };
  sheet.querySelector("#resetJ").onclick = function(){
    if(!confirm("Alles auf den veröffentlichten Plan zurücksetzen?")) return;
    S = seed(); saved("Zurückgesetzt"); applyView(); render(); loadWeather(); closeSheet();
  };
}

document.getElementById("fileIn").onchange = function(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(){
    try{
      const j = JSON.parse(r.result);
      if(!j || !j.days || !j.start) throw new Error("shape");
      S = normalise(j);
      saved("Importiert"); applyView(); render(); loadWeather(); closeSheet();
    }catch(err){ toast("Datei nicht lesbar"); }
  };
  r.readAsText(f); e.target.value = "";
};

/* ================= view ================= */
function applyView(){
  const v = S.view || (window.innerWidth <= 720 ? "list" : "week");
  document.body.classList.toggle("view-week", v==="week");
  document.body.classList.toggle("view-list", v==="list");
  document.body.classList.toggle("view-places", v==="places");
  document.getElementById("btnWeek").setAttribute("aria-pressed", v==="week");
  document.getElementById("btnList").setAttribute("aria-pressed", v==="list");
  document.getElementById("btnPlaces").setAttribute("aria-pressed", v==="places");
}
document.getElementById("btnWeek").onclick = function(){ S.view = "week"; save(); applyView(); };
document.getElementById("btnList").onclick = function(){ S.view = "list"; save(); applyView(); };
document.getElementById("btnPlaces").onclick = function(){ S.view = "places"; save(); applyView(); };
document.getElementById("btnSettings").onclick = openSettings;
scrim.onclick = closeSheet;

document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ closeSheet(); return; }
  if(openIso && e.target.tagName!=="INPUT" && !e.target.isContentEditable){
    const all = dateList(), i = all.indexOf(openIso);
    if(e.key==="ArrowLeft" && i>0){ e.preventDefault(); openDay(all[i-1]); }
    if(e.key==="ArrowRight" && i<all.length-1){ e.preventDefault(); openDay(all[i+1]); }
  }
});
document.addEventListener("click", function(e){
  if(blockClick){ blockClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const pb = e.target.closest("[data-pin]");
  if(pb){
    const n = pb.dataset.pin;
    S.pins = S.pins || [];
    const at = S.pins.indexOf(n);
    if(at >= 0) S.pins.splice(at,1); else S.pins.push(n);
    saved(at >= 0 ? n+" gelöst" : n+" angeheftet");
    render(); loadWeather(); return;
  }
  const kk = e.target.closest("[data-kind]");
  if(kk){
    const i = +kk.dataset.kind, order = ["any","out","in"];
    S.ideas[i].k = order[(order.indexOf(S.ideas[i].k) + 1) % 3];
    saved(); renderIdeas(); return;
  }
  const rc = e.target.closest("[data-rec]");
  if(rc){
    const i = +rc.dataset.rec, iso = rc.dataset.iso, o = S.ideas[i];
    addItem(iso, {t:o.t, k:o.k}, 1);
    S.ideas.splice(i,1);
    saved(); render(); openDay(iso); return;
  }
  const d = e.target.closest("[data-delidea]");
  if(d){ S.ideas.splice(+d.dataset.delidea,1); saved(); renderIdeas(); return; }
  if(e.target.closest("[data-idea]")) return;
  const b = e.target.closest("[data-iso]");
  if(b) openDay(b.dataset.iso);
}, true);

document.getElementById("addIdea").onclick = function(){
  S.ideas.push({t:"Neue Idee", k:"any"}); saved(); renderIdeas();
  const els = document.querySelectorAll("[data-idea]");
  const last = els[els.length-1];
  if(last){ last.focus(); const sel = window.getSelection(); if(sel && sel.selectAllChildren) sel.selectAllChildren(last); }
};
document.getElementById("ideas").addEventListener("blur", function(e){
  const el = e.target.closest("[data-idea]"); if(!el) return;
  const t = el.textContent.trim(), i = +el.dataset.idea;
  if(t) S.ideas[i].t = t; else S.ideas.splice(i,1);
  saved(); renderIdeas();
}, true);

["title","subtitle"].forEach(function(id){
  const el = document.getElementById(id);
  el.addEventListener("blur", function(){ S[id] = el.textContent.trim(); saved(); render(); });
  el.addEventListener("keydown", function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); el.blur(); } });
});

document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && Date.now() - lastSyncAt > 5000) initialSync();
});
window.addEventListener("focus", function(){
  if(Date.now() - lastSyncAt > 5000) initialSync();
});
window.addEventListener("online", function(){ initialSync(); });
setInterval(function(){
  if(document.visibilityState === "visible" && Date.now() - lastSyncAt > 45000) initialSync();
}, 20000);
document.getElementById("syncNote").addEventListener("click", function(){
  toast("Aktualisiere…"); initialSync();
});

/* pull down at the top of the page to force a sync */
(function(){
  const ind = document.getElementById("ptr");
  let startY = null, dist = 0;
  function setPtr(d){
    dist = d;
    ind.style.transform = "translate(-50%,"+(d ? Math.min(d, 90) - 46 : -46)+"px)";
    ind.style.opacity = d > 8 ? "1" : "0";
    ind.classList.toggle("ready", d >= 60);
    ind.textContent = d >= 60 ? "Loslassen zum Aktualisieren" : "Zum Aktualisieren ziehen";
  }
  window.addEventListener("touchstart", function(e){
    if(window.scrollY > 0 || e.touches.length !== 1 ||
       e.target.closest("[data-drag], .sheet, .scrim.on")){ startY = null; return; }
    startY = e.touches[0].clientY;
  }, {passive:true});
  window.addEventListener("touchmove", function(e){
    if(startY === null) return;
    const d = e.touches[0].clientY - startY;
    setPtr(d > 0 ? d : 0);
  }, {passive:true});
  window.addEventListener("touchend", function(){
    if(startY === null) return;
    const fire = dist >= 60;
    setPtr(0); startY = null;
    if(fire){ toast("Aktualisiere…"); initialSync(); }
  }, {passive:true});
  setPtr(0);
})();

checkSeedVersion();
lastSig = sigOf(S);
applyView();
render();
loadWeather();
setSync(syncState);
initialSync();

if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
